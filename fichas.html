                </div>
                <div id="camposAbono" style="display:none">
                    <div class="campo"><label>Monto que paga</label><input type="text" inputmode="decimal" id="aMonto"></div>
                </div>
                <button class="btn-main btn-verde" onclick="guardarPago()">💾 Guardar pago</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>`;
            $('modal').classList.add('show');
            precioConcepto();
        }

        function precioConcepto() {
            const a = alumno(PAGO.id), c = $('pConcepto').value;
            const precio = (a.precios || {})[c] || (c === 'Mensualidad' ? a.pago.mensualidad : 0) || '';
            $('pCobrada').value = precio; $('pPagada').value = precio;
        }

        function usarAtajo(i) {
            const a = alumno(PAGO.id), d = a.pago.detalle[i];
            const yaSel = PAGO.atajo === i;
            document.querySelectorAll('.atajo').forEach(b => b.classList.remove('sel'));
            PAGO.atajo = yaSel ? null : i;
            if (!yaSel) $('at' + i).classList.add('sel');
            const abono = !yaSel && d.fila;
            $('camposNuevo').style.display = abono ? 'none' : 'block';
            $('camposAbono').style.display = abono ? 'block' : 'none';
            $('abonoInfo').innerHTML = abono ? `<div class="abono-info">Se suma al cobro de <b>${esc(d.concepto)} de ${fMes(d.mes)}</b> que ya está en tu hoja (resta ${dinero(d.monto)}).</div>` : '';
            if (abono) $('aMonto').value = d.monto;
            else if (!yaSel) { $('pConcepto').value = d.concepto; $('pCobrada').value = d.monto; $('pPagada').value = d.monto; }
        }

        const aNum = v => { const n = Number(String(v ?? '').replace(/[$,\s]/g, '')); return String(v ?? '').trim() === '' || isNaN(n) ? null : n; };

        async function guardarPago() {
            const a = alumno(PAGO.id);
            const d = PAGO.atajo != null ? a.pago.detalle[PAGO.atajo] : null;
            let body, resumen;
            if (d && d.fila) {
                const m = aNum($('aMonto').value);
                if (!m || m <= 0) return alert('Escribe el monto que paga.');
                if (m > d.monto && !confirm(`El monto (${dinero(m)}) es mayor a lo que resta (${dinero(d.monto)}). ¿Guardar así?`)) return;
                body = { accion: 'abonarPago', id: a.id, fila: d.fila, monto: m };
                resumen = { monto: m, concepto: d.concepto, mes: d.mes };
            } else {
                const fecha = $('pFecha').value, concepto = $('pConcepto').value;
                const cob = aNum($('pCobrada').value), pag = aNum($('pPagada').value);
                if (!fecha) return alert('Elige la fecha.');
                if (cob == null || pag == null || cob < 0 || pag < 0) return alert('Revisa los montos.');
                if (!cob && !pag) return alert('Escribe un monto.');
                body = { accion: 'registrarPago', id: a.id, fecha, concepto, cobrada: cob, pagada: pag };
                // Mes que cubre una mensualidad: el pendiente más antiguo, o si está al corriente, el próximo
                let mes = d ? d.mes : fecha.slice(0, 7);
                if (!d && concepto === 'Mensualidad') {
                    const pend = a.pago.detalle.find(x => x.concepto === 'Mensualidad' && !x.fila);
                    mes = pend ? pend.mes : (a.pago.proximoMes || mes);
                }
                resumen = { monto: pag, concepto, mes, resta: Math.max(0, cob - pag) };
            }
            if (!(await enviar(body))) return;
            render();
            const b = alumno(PAGO.id);
            const num = waNumero(b && b.telefono);
            $('modalIn').innerHTML = `
                <div class="vacio" style="padding:20px 10px 10px"><div style="font-size:3rem">✅</div><b style="font-size:1.2rem;color:var(--text)">Pago registrado</b><br>
                ${dinero(resumen.monto)} · ${esc(resumen.concepto)} ${fMes(resumen.mes)}<br>
                ${b && b.pago ? (b.pago.adeudo > 0 ? `<span class="rojo">Aún debe ${dinero(b.pago.adeudo)}</span>` : '<span style="color:#1e8449">Queda al corriente</span>') : ''}</div>
                ${num ? `<button class="btn-main btn-wa" onclick="confirmacionPago()">💬 Enviar confirmación al papá/mamá</button>` : ''}
                <button class="btn-main btn-gris" onclick="cerrarModal()">Listo</button>`;
            $('modal').classList.add('show');
            PAGO.resumen = resumen;
            toast('✅ Pago guardado');
        }

        function confirmacionPago() {
            const a = alumno(PAGO.id), r = PAGO.resumen;
            const saludo = a.padre ? `Hola ${a.padre.split(' ')[0]}` : 'Hola';
            const extra = a.pago && a.pago.adeudo > 0 ? `\n\nSaldo pendiente: ${dinero(a.pago.adeudo)}.` : '';
            const txt = `${saludo} 😊\n\nConfirmamos de recibido su pago de *${dinero(r.monto)}* por ${r.concepto} de ${fMes(r.mes)} de ${a.alumno.split(' ')[0]}.${extra}\n\n¡Muchas gracias! — ${ESCUELA}`;
            abrirWhatsApp(waNumero(a.telefono), txt);
            registrarContacto(a.id, 'gracias');
        }

        // ---------- ALTA / EDICIÓN DE ALUMNOS ----------
        function moda(arr) {
            const c = {}; let mejor = '', n = 0;
            arr.filter(x => x !== '' && x != null).forEach(x => { c[x] = (c[x] || 0) + 1; if (c[x] > n) { n = c[x]; mejor = x; } });
            return mejor;
        }

        function vistaFormAlumno(id, grupoPre) {
            if (!esAdmin()) { location.hash = '#/'; return; }
            const a = id ? alumno(id) : null;
            if (id && !a) { header('Alumno', true); return main('<div class="vacio">No encontré a este alumno.</div>'); }
            header(a ? '✏️ Editar alumno' : '➕ Nuevo alumno', true);
            SUGERIDO = {}; HORARIO_PROPIO = false;
            const grupos = [...new Set((DATA.grupos || []).map(g => g.nombre).concat(DATA.listas.grupos || [], DATA.alumnos.map(x => x.grupo)).filter(g => g && g !== 'Sin grupo'))].sort(comparar);
            const libros = [...new Set((DATA.listas.libros || []).concat(DATA.alumnos.map(x => x.libro)).filter(Boolean))];
            const v = a ? {
                nombre: a.alumno, cumple: a.cumple, alergia: a.alergia, padre: a.padre, telefono: a.telefono,
                grupo: a.grupo === 'Sin grupo' ? '' : a.grupo, libro: a.libro, horario: a.horario, inicio: a.inicio || '',
                dia: a.dia, mensualidad: (a.precios || {})['Mensualidad'] || '', inscripcion: (a.precios || {})['Inscripción'] ?? '', material: (a.precios || {})['Material'] ?? ''
            } : { nombre: '', cumple: '', alergia: 'No', padre: '', telefono: '', grupo: grupoPre, libro: '', horario: '', inicio: hoy(), dia: '', mensualidad: '', inscripcion: '', material: '' };
            const campo = (k, label, tipo = 'text', req = false, extra = '') => `
                <div class="campo" id="c_${k}"><label>${label}${req ? ' <span class="req">*</span>' : ''}</label>
                <input id="f_${k}" type="${tipo}" value="${esc(v[k] ?? '')}" ${extra}></div>`;
            main(`
                <div class="form-sec"><h4>👦 Alumno</h4>
                    ${campo('nombre', 'Nombre completo', 'text', true, 'autocapitalize="words"')}
                    <div class="dos">
                        ${campo('cumple', 'Fecha de nacimiento', 'date')}
                        ${campo('alergia', 'Alergia / condición')}
                    </div>
                </div>
                <div class="form-sec"><h4>👪 Papá / mamá</h4>
                    ${campo('padre', 'Nombre', 'text', true, 'autocapitalize="words"')}
                    ${campo('telefono', 'Teléfono (10 dígitos)', 'tel', true, 'inputmode="numeric" maxlength="14"')}
                </div>
                <div class="form-sec"><h4>📚 Clase</h4>
                    <div class="campo" id="c_grupo"><label>Grupo <span class="req">*</span></label>
                        <select id="f_grupo" onchange="sugerirDeGrupo()"><option value="">Elige…</option>${grupos.map(g => `<option ${g === v.grupo ? 'selected' : ''}>${esc(g)}</option>`).join('')}
</select>
                        <div class="sub" style="margin-top:6px">¿No está? <span class="link-pin" onclick="ir('#/grupo/nuevo')">Crear grupo nuevo</span></div></div>
                    <div class="dos">
                        <div class="campo"><label>Libro</label>
                            <select id="f_libro"><option value="">—</option>${libros.map(l => `<option ${l === v.libro ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
                        ${campo('inicio', 'Fecha de inicio', 'date', true, 'onchange="autoDia()"')}
                    </div>
                    <div class="campo" id="c_horario"><label>Horario</label>
                        <div id="horarioFijo" class="horario-fijo"></div>
                        <input id="f_horario" type="text" value="${esc(v.horario)}" placeholder="Ej. Lun y Mié 4:30pm - 6:00pm" style="display:none;margin-top:8px">
                    </div>
                </div>
                <div class="form-sec"><h4>💰 Pagos</h4>
                    <div class="dos">
                        ${campo('mensualidad', 'Mensualidad', 'text', true, 'inputmode="decimal"')}
                        ${campo('dia', 'Día de pago (1-31)', 'text', true, 'inputmode="numeric" maxlength="2"')}
                    </div>
                    <div class="dos">
                        ${campo('inscripcion', 'Inscripción', 'text', false, 'inputmode="decimal"')}
                        ${campo('material', 'Material', 'text', false, 'inputmode="decimal"')}
                    </div>
                </div>
                <p class="ayuda"><span class="req" style="color:#c0392b">*</span> Obligatorio. ${a ? `ID: <b>${esc(a.id)}</b>` : 'El ID se asigna solo.'}</p>`);
            footer(`<button class="btn-main btn-verde" onclick="guardarAlumnoForm(${a ? `'${esc(a.id)}'` : 'null'})">💾 ${a ? 'Guardar cambios' : 'Dar de alta'}</button>`);
            mostrarHorario(true);
            if (!a && grupoPre) sugerirDeGrupo();
            if (!a) autoDia();
        }

        // Horario: lo define el grupo. Solo se escribe si el grupo no tiene horario fijo (ej. Particular)
        let HORARIO_PROPIO = false;
        function mostrarHorario(inicial) {
            const g = $('f_grupo').value, cfg = grupoCfg(g), inp = $('f_horario'), box = $('horarioFijo');
            const fijo = cfg && cfg.horario ? cfg.horario : '';
            if (!g) { box.style.display = 'block'; box.innerHTML = '<span class="sub">Elige primero el grupo</span>'; inp.style.display = 'none'; return; }
            if (g === '__particular__') {
                if (!inicial) inp.value = '';
                inp.style.display = 'block'; inp.placeholder = 'Ej. Mié 10:30am - 12:30pm';
                box.style.display = 'block'; box.innerHTML = '<span class="sub">⭐ Se le creará su propio grupo. Escribe el horario de su clase:</span>';
                return;
            }
            if (inicial && fijo && inp.value && inp.value !== fijo) HORARIO_PROPIO = true;   // alumno con horario distinto al del grupo
            if (fijo && !HORARIO_PROPIO) {
                inp.value = fijo; inp.style.display = 'none'; box.style.display = 'block';
                box.innerHTML = `🕐 <b>${esc(fijo)}</b><br><span class="link-pin" style="font-size:0.85rem" onclick="horarioPropio()">Cambiar solo para este alumno</span>`;
            } else {
                if (!inicial && !HORARIO_PROPIO) inp.value = '';
                inp.style.display = 'block';
                box.style.display = fijo ? 'block' : 'none';
                box.innerHTML = fijo ? `<span class="sub">Horario del grupo: ${esc(fijo)} · <span class="link-pin" onclick="horarioDelGrupo()">usar ese</span></span>` : '';
                if (!fijo) inp.placeholder = 'Este grupo no tiene horario fijo: escríbelo';
            }
        }
        // Alumno nuevo: el día de pago se propone con el día de su fecha de inicio (lo puedes cambiar)
        function autoDia() {
            if (ruta()[0] !== 'nuevo') return;
            const ini = $('f_inicio').value, el = $('f_dia');
            if (!/^\d{4}-\d{2}-\d{2}$/.test(ini)) return;
            SUGERIDO = SUGERIDO || {};
            const d = String(Number(ini.slice(8, 10)));
            if (el.value === '' || el.value === SUGERIDO.dia) { el.value = d; SUGERIDO.dia = d; }
        }

        function horarioPropio() { HORARIO_PROPIO = true; $('f_horario').value = ''; mostrarHorario(true); $('f_horario').focus(); }
        function horarioDelGrupo() { HORARIO_PROPIO = false; mostrarHorario(false); }

        // Al elegir grupo: horario fijo + (alumnos nuevos) libro y precios del grupo
        let SUGERIDO = null;
        function sugerirDeGrupo() {
            HORARIO_PROPIO = false;
            mostrarHorario(false);
            if (ruta()[0] !== 'nuevo') return;
            const g = $('f_grupo').value, cfg = grupoCfg(g);
            const del = DATA.alumnos.filter(x => g === '__particular__' ? /^particular/i.test(x.grupo) : x.grupo === g);
            const de = (k, alt) => cfg && cfg[k] !== '' && cfg[k] != null ? cfg[k] : alt;
            // Solo reemplaza si el campo está vacío o todavía tiene la sugerencia anterior (no lo que tú escribiste)
            SUGERIDO = SUGERIDO || {};
            const pon = (k, val) => {
                const el = $('f_' + k), actual = el.value;
                if (val === '' || val == null) return;
                if (actual === '' || actual === String(SUGERIDO[k] ?? '')) { el.value = val; SUGERIDO[k] = String(val); }
            };
            pon('mensualidad', de('mensualidad', moda(del.map(x => (x.precios || {})['Mensualidad']))));
            pon('inscripcion', de('inscripcion', moda(del.map(x => (x.precios || {})['Inscripción']))));
            pon('material', de('material', moda(del.map(x => (x.precios || {})['Material']))));
            const l = de('libro', moda(del.map(x => x.libro)));
            if (l && ($('f_libro').value === '' || $('f_libro').value === SUGERIDO.libro)) {
                if (![...$('f_libro').options].some(o => o.value === l)) $('f_libro').add(new Option(l, l));
                $('f_libro').value = l; SUGERIDO.libro = l;
            }
        }

        // ---------- NUEVO GRUPO / EDITAR GRUPO ----------
        const DIAS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
        // Horas de 7:00am a 9:00pm, cada 30 minutos
        let HG = null;
        const hora12 = t => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')}${ap}`; };
        function textoHorario() {
            if (!HG.dias.length || !HG.ini || !HG.fin) return '';
            const dias = DIAS.filter(d => HG.dias.includes(d));
            return `${lista_y(dias)} ${hora12(HG.ini)} - ${hora12(HG.fin)}`;
        }

        function vistaFormGrupo(nombre) {
            if (!esAdmin()) { location.hash = '#/'; return; }
            let g = nombre ? grupoCfg(nombre) : null;
            // Grupo que existe (en alumnos o listas) pero sin fila en la pestaña Grupos: se puede configurar o eliminar
            const sinCfg = !!nombre && !g;
            if (sinCfg) g = { nombre, horario: '', libro: '', mensualidad: '', inscripcion: '', material: '' };
            header(sinCfg ? '⚙️ Configurar grupo' : g ? '⚙️ Editar grupo' : '➕ Nuevo grupo', true);
            HG = { dias: [], ini: '', fin: '', cambiar: !g || !g.horario, libre: !!g && !g.horario && !sinCfg };
            const visIni = g ? visualGrupo(g.nombre) : { icono: '', color: '' };
            HG.icono = (g && g.icono) || ''; HG.color = (g && g.color) || '';
            HG.iconoAuto = visIni.icono; HG.colorAuto = visIni.color;
            const libros = [...new Set((DATA.listas.libros || []).concat(DATA.alumnos.map(x => x.libro), (DATA.grupos || []).map(x => x.libro)).filter(Boolean))];
            const nAl = g ? alumnosDe(g.nombre).length : 0;
            const val = (k, def = '') => g && g[k] !== '' && g[k] != null ? g[k] : def;
            main(`
                ${sinCfg ? '<div class="aviso" style="margin:0 0 14px">Este grupo no tiene configuración en tu pestaña <b>Grupos</b>. Llena sus datos para crearla, o elimínalo abajo.</div>' : ''}
                <div class="form-sec"><h4>👥 Grupo</h4>
                    <div class="campo" id="c_gnombre"><label>Nombre del grupo <span class="req">*</span></label>
                        <input id="g_nombre" type="text" value="${esc(val('nombre'))}" placeholder="Ej. Kids 5pm, Teens Sabatino"></div>
                </div>
                <div class="form-sec"><h4>👩‍🏫 Maestra</h4>
                    <div class="campo"><select id="g_maestra">
                        <option value="">— Sin asignar —</option>
                        <option value="Sin pago" ${val('maestra') === 'Sin pago' ? 'selected' : ''}>🚫 Sin pago (la da la dueña / administración)</option>
                        ${(DATA.maestras || []).filter(m => m.activa || m.nombre === val('maestra')).map(m => `<option ${m.nombre === (val('maestra') || (g ? maestraDe(g.nombre) : '')) ? 'selected' : ''}>${esc(m.nombre)}</option>`).join('')}
                    </select></div>
                    <p class="ayuda" style="margin-top:-4px;text-align:left">Con esto se calculan sus horas de la semana para pagarle. Las maestras se dan de alta en 👩‍🏫 Maestras (versión computadora).</p>
                </div>
                <div class="form-sec"><h4>🎨 Apariencia</h4><div id="aparienciaGrupo"></div></div>
                <div class="form-sec"><h4>🕐 Horario</h4><div id="horarioGrupo"></div></div>
                <div class="form-sec"><h4>📚 Libro</h4>
                    <div class="campo"><select id="g_libro" onchange="$('g_libroNuevo').style.display = this.value === '__nuevo__' ? 'block' : 'none'">
                        <option value="">— Sin libro —</option>
                        ${libros.map(l => `<option ${l === val('libro') ? 'selected' : ''}>${esc(l)}</option>`).join('')}
                        <option value="__nuevo__">➕ Otro libro…</option></select>
                        <input id="g_libroNuevo" type="text" placeholder="Nombre del libro" style="display:none;margin-top:8px"></div>
                </div>
                <div class="form-sec"><h4>💰 Precios</h4>
                    <div class="campo" id="c_gmens"><label>Mensualidad <span class="req">*</span></label><input id="g_mens" inputmode="decimal" value="${esc(val('mensualidad'))}"></div>
                    <div class="dos">
                        <div class="campo"><label>Inscripción</label><input id="g_insc" inputmode="decimal" value="${esc(val('inscripcion'))}"></div>
                        <div class="campo"><label>Material</label><input id="g_mat" inputmode="decimal" value="${esc(val('material'))}"></div>
                    </div>
                    ${g ? '<p class="ayuda" style="margin-top:0">Los precios aplican a los alumnos que des de alta a partir de ahora. Los alumnos actuales conservan el suyo.</p>' : ''}
                </div>
                ${g && nAl ? `<label class="check"><input type="checkbox" id="g_actHor" checked> <span>Si cambio el horario, actualizarlo también en los <b>${nAl} alumnos</b> de este grupo</span></label>` : ''}
                ${g ? `<button class="btn-rojo-txt" onclick="eliminarGrupo()">🗑️ Eliminar grupo</button>` : ''}`);
            footer(`<button class="btn-main btn-verde" onclick="guardarGrupoForm()">💾 ${g ? 'Guardar cambios' : 'Crear grupo'}</button>`);
            pintarHorarioGrupo();
            pintarApariencia();
            $('g_nombre').addEventListener('input', () => pintarApariencia());
        }

        function aparienciaAuto() { HG.icono = ''; HG.color = ''; pintarApariencia(); }

        function pintarApariencia() {
            const nombre = ($('g_nombre') && $('g_nombre').value.trim()) || 'Grupo';
            const ico = HG.icono || iconoAuto(nombre), col = HG.color || colorAuto(nombre);
            $('aparienciaGrupo').innerHTML = `
                <div class="card card-g preview-g" style="${estiloGrupo({ color: col })}"><div class="icono-g">${ico}</div><div class="nombre">${esc(nombre)}</div></div>
                <div class="ayuda" style="margin:0 0 10px">${HG.icono || HG.color ? '<span class="link-pin" onclick="aparienciaAuto()">Volver a automático</span>' : 'Automático según el nombre. Toca para cambiarlo.'}</div>
                <label style="display:block;font-size:0.8rem;font-weight:700;color:var(--text-light);margin-bottom:6px">Ícono</label>
                <div class="iconos">${ICONOS.map(x => `<button class="ico-op ${x === ico ? 'sel' : ''}" onclick="HG.icono='${x}';pintarApariencia()">${x}</button>`).join('')}</div>
                <label style="display:block;font-size:0.8rem;font-weight:700;color:var(--text-light);margin-bottom:6px">Color</label>
                <div class="colores">${COLORES.map(c => `<button class="col-op ${c === col ? 'sel' : ''}" style="background:${c}" onclick="HG.color='${c}';pintarApariencia()"></button>`).join('')}</div>`;
        }

        function pintarHorarioGrupo() {
            const g = ruta()[1] === 'nuevo' ? null : grupoCfg(ruta()[1]);
            const box = $('horarioGrupo');
            if (!HG.cambiar && g && g.horario) {
                box.innerHTML = `<div class="horario-fijo">🕐 <b>${esc(g.horario)}</b><br><span class="link-pin" style="font-size:0.85rem" onclick="HG.cambiar = true; HG.libre = false; pintarHorarioGrupo()">Cambiar horario</span></div><div style="height:12px"></div>`;
                return;
            }
            // Hora (6am a 10pm) y minuto (00 a 59) por separado: permite cualquier horario, ej. 2:45 a 4:15
            const selHora = (cual) => {
                const [hh, mm] = (HG[cual] || ':').split(':');
                return `<div class="hora-min">
                    <select id="g_${cual}H" onchange="cambiaHora('${cual}')"><option value="">Hora</option>${Array.from({ length: 17 }, (_, i) => i + 6).map(h =>
                        `<option value="${String(h).padStart(2, '0')}" ${String(h).padStart(2, '0') === hh ? 'selected' : ''}>${h % 12 || 12} ${h >= 12 ? 'pm' : 'am'}</option>`).join('')}</select>
                    <select id="g_${cual}M" onchange="cambiaHora('${cual}')">${Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0')).map(m =>
                        `<option value="${m}" ${m === (mm || '00') ? 'selected' : ''}>:${m}</option>`).join('')}</select>
                </div>`;
            };
            box.innerHTML = `
                <label class="check"><input type="checkbox" ${HG.libre ? 'checked' : ''} onchange="HG.libre = this.checked; pintarHorarioGrupo()">
                    <span>Sin horario fijo <span class="sub">(cada alumno tiene el suyo y su clase se registra por separado)</span></span></label>
                ${HG.libre ? '' : `
                    <div class="campo" id="c_gdias"><label>Días <span class="req">*</span></label>
                        <div class="dias">${DIAS.map(d => `<button class="dia ${HG.dias.includes(d) ? 'sel' : ''}" onclick="toggleDia('${d}')">${d}</button>`).join('')}</div></div>

        let COBRO = [];

                .sort((x, y) => x.pago.proximo < y.pago.proximo ? -1 : 1);

                ${deben.length ? `<div class="lista" style="margin-top:0">${deben.map((a, i) => {
                    return fila(a, i, `${esc(a.grupo)} · ${esc(resumenPend(a.pago))}${marcaMsg(a.id)}`, `<span class="fila-monto rojo">${dinero(a.pago.adeudo)}</span>`);
                }).join('')}</div>` : '<div class="vacio">🎉 Nadie debe nada.</div>'}
                <h3>Pagos de los próximos 7 días</h3>
                ${proximos.length ? `<div class="lista" style="margin-top:0">${proximos.map((a, i) =>
                    fila(a, deben.length + i, `${esc(a.grupo)} · vence ${fDia(a.pago.proximo)}${marcaMsg(a.id)}`, `<span class="fila-monto">${dinero(a.pago.mensualidad)}</span>`)
                ).join('')}</div>` : '<div class="vacio">Sin pagos próximos.</div>'}
                <p class="ayuda">💬 abre WhatsApp con un recordatorio ya escrito.</p>`);
        }

        // =====================================================================
        //  VERSIÓN COMPUTADORA (solo administrador, pantalla de 1024 px o más)
        //  Se activa sola; desde ahí se puede cambiar a la versión celular.
        // =====================================================================
        const ANCHO_PC = 1024;
        const pantallaAncha = () => window.innerWidth >= ANCHO_PC;
        const modoPC = () => CARGADO && esAdmin() && pantallaAncha() && lsGet('fichas_modo') !== 'movil';
        function usarModo(m) { lsSet('fichas_modo', m === 'movil' ? 'movil' : null); PANEL = null; location.hash = '#/'; render(); }

        const sumarDias = (f, n) => { const d = new Date(f + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
        const difDias = (a, b) => Math.round((new Date(a + 'T12:00:00') - new Date(b + 'T12:00:00')) / 864e5);   // a − b
        const fLarga = f => { const d = new Date(f + 'T12:00:00'); return isNaN(d) ? f : d.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', ''); };
        const MES_CORTO = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const corto = n => { const w = String(n).trim().split(/\s+/); return w.length >= 4 ? w[0] + ' ' + w[2] : w.slice(0, 2).join(' '); };
        const mesesDe = a => (a.pago && a.pago.meses) || [];

        // Estado de un mes de cobro de un alumno
        const EST = {
            vencido: { c: '#e74c3c', b: '#fdecea', t: '#b03a2e', txt: 'Vencido sin pagar' },
            hoy:     { c: '#e67e22', b: '#fdf0e3', t: '#a04000', txt: 'Vence hoy' },
            pronto:  { c: '#f1c40f', b: '#fff8db', t: '#8a6d00', txt: 'Vence en los próximos 7 días' },
            futuro:  { c: '#b2bec3', b: '#f1f3f5', t: '#636e72', txt: 'Por vencer' },
            parcial: { c: '#9b59b6', b: '#f5eef8', t: '#7d3c98', txt: 'Pagó una parte' },
            ok:      { c: '#2ecc71', b: '#e8f8ef', t: '#1e8449', txt: 'Pagado' }
        };
        const ORDEN_EST = ['vencido', 'hoy', 'parcial', 'pronto', 'futuro', 'ok'];
        const estiloEst = e => `--c:${EST[e].c};--b:${EST[e].b};--t:${EST[e].t}`;
        function estadoMes(a, per) {
            const h = hoy();
            if (per.pagado) return a.pago.detalle.some(d => d.concepto === 'Mensualidad' && d.fila && d.mes === per.mes) ? 'parcial' : 'ok';
            if (per.vence < h) return 'vencido';
            if (per.vence === h) return 'hoy';
            return per.vence <= sumarDias(h, 7) ? 'pronto' : 'futuro';
        }

        // Días de atraso: desde la mensualidad vencida más antigua sin pagar
        function diasAtraso(a) {
            const v = mesesDe(a).find(x => !x.pagado && x.vence <= hoy());
            return v ? difDias(hoy(), v.vence) : null;
        }
        const proxPendiente = a => mesesDe(a).find(x => !x.pagado && x.vence >= hoy()) || null;

        // ---------- Plantillas de mensajes por etapa de cobranza ----------
        const PLANTILLAS = [
            { k: 'preventivo', ico: '🔔', nombre: 'Recordatorio previo', cuando: 'unos días antes de la fecha de pago' },
            { k: 'hoy', ico: '📅', nombre: 'Vence hoy', cuando: 'el día del pago' },
            { k: 'seguimiento', ico: '🙂', nombre: 'Seguimiento', cuando: 'cuando ya pasó su fecha de pago' }
        ];
        const plantilla = k => PLANTILLAS.find(x => x.k === k);

        // Qué mensaje conviene mandar hoy (null = nada por ahora). Toma en cuenta lo que ya se le mandó.
        function etapa(a) { const k = etapaBase(a); return k && !yaAvisado(a, k) ? k : null; }
        const DEUDA = ['hoy', 'seguimiento', 'formal', 'cita'];
        function yaAvisado(a, k) {
            const cs = contactosDe(a.id), h = hoy();
            if (!cs.length) return false;
            const dias = c => difDias(h, c.fecha.slice(0, 10));
            if (dias(cs[cs.length - 1]) === 0) return true;                       // ya se le escribió hoy
            if (k === 'gracias') { const u = a.pago.ultimos[0]; return cs.some(c => c.k === 'gracias' && c.fecha.slice(0, 10) >= u.fecha); }
            if (k === 'preventivo') { const pr = proxPendiente(a); const desde = pr ? sumarDias(pr.vence, -7) : h; return cs.some(c => (c.k === 'preventivo' || c.k === 'hoy') && c.fecha.slice(0, 10) >= desde); }
            if (k === 'hoy') return cs.some(c => (c.k === 'preventivo' || c.k === 'hoy') && dias(c) <= 2);
            // adeudo: no más de un mensaje cada 3 días, y el mismo tipo de mensaje no antes de 10 días
            const ult = cs.filter(c => DEUDA.includes(c.k)).pop();
            return !!ult && (dias(ult) < 3 || (ult.k === k && dias(ult) < 10));
        }
        function etapaBase(a) {
            const p = a.pago, h = hoy();
            if (!p) return null;
            if (p.adeudo > 0) {
                const d = diasAtraso(a);
                if (d === 0) return 'hoy';
                return 'seguimiento';
            }
            const pr = proxPendiente(a);
            if (pr && difDias(pr.vence, h) <= 3) return pr.vence === h ? 'hoy' : 'preventivo';
            return null;
        }

        function plantillaDisponible(k, a) {
            const p = a.pago;
            if (k === 'seguimiento' || k === 'formal' || k === 'cita') return p.adeudo > 0;
            if (k === 'gracias') return p.ultimos.length > 0;
            if (k === 'hoy') return mesesDe(a).some(x => !x.pagado && x.vence === hoy());
            return !!(proxPendiente(a) || p.proximo);
        }

        function textoPlantilla(k, a) {
            const p = a.pago, nombre = a.alumno.split(' ')[0];
            const saludo = a.padre ? `Hola ${a.padre.split(' ')[0]}` : 'Hola';
            const datos = datosPago();
            const lineas = p.detalle.map(d => `• ${etiquetaCargo(d)}: ${dinero(d.monto)}`).join('\n');
            const total = `*Total: ${dinero(p.adeudo)}*`;
            if (k === 'preventivo') {
                const pr = proxPendiente(a) || { mes: p.proximoMes, vence: p.proximo };
                if (p.adeudo > 0) { const t = textoPendientes(a);
                    return `${saludo}, ¿cómo está? 😊\n\nLe compartimos los pagos pendientes de ${nombre}:\n\n${t.lineas}\n\n*Total a pagar: ${dinero(t.total)}*${datos}\n\n¡Muchas gracias! — ${ESCUELA}`; }
                return `${saludo}, ¿cómo está? 😊\n\nLe recordamos que la mensualidad de ${fMes(pr.mes)} de ${nombre} (${dinero(p.mensualidad)}) vence el ${fLarga(pr.vence)}.${datos}\n\n¡Muchas gracias! — ${ESCUELA}`;
            }
            if (k === 'hoy') {
                const pr = mesesDe(a).find(x => !x.pagado && x.vence === hoy()) || { mes: hoy().slice(0, 7) };
                const otros = p.detalle.filter(d => !(d.concepto === 'Mensualidad' && !d.fila && d.mes === pr.mes));
                const extra = otros.length ? `\n\nPagos pendientes:\n${textoPendientes(a).lineas}\n\n*Total a pagar: ${dinero(textoPendientes(a).total)}*` : '';
                return `${saludo}, buen día 😊\n\nLe recordamos que hoy es la fecha de pago de la mensualidad de ${fMes(pr.mes)} de ${nombre} (${dinero(p.mensualidad)}).${extra}${datos}\n\nSi ya realizó su pago, le pedimos ignorar este mensaje. ¡Gracias! — ${ESCUELA}`;
            }
            if (k === 'seguimiento') {
                const t = textoPendientes(a);
                return `${saludo}, ¿cómo está? 😊\n\nLe escribimos porque aún no vemos reflejado el pago de ${nombre}:\n\n${t.lineas}\n\n*Total a pagar: ${dinero(t.total)}*\n\nSi ya lo realizó, ¿nos podría compartir su comprobante para registrarlo?${datos}\n\n¡Muchas gracias! — ${ESCUELA}`;
            }
            if (k === 'formal')
                return `${saludo}, buen día.\n\nLe damos seguimiento al saldo pendiente de ${nombre} en ${ESCUELA}:\n\n${lineas}\n\n${total}\n\n¿Nos podría confirmar en qué fecha podrá realizar el pago? Si necesita organizarlo de otra forma, con gusto lo platicamos.${datos}\n\nQuedamos atentos, gracias.`;
            if (k === 'cita')
                return `${saludo}, buen día.\n\nNos gustaría platicar con usted sobre la cuenta de ${nombre}, que tiene un saldo pendiente de ${dinero(p.adeudo)}.\n\n¿Tendrá unos minutos esta semana para una llamada o para pasar a la escuela? Queremos encontrar juntos la mejor opción para que ${nombre} siga con sus clases sin contratiempos.\n\nQuedamos atentos. — ${ESCUELA}`;
            if (k === 'gracias') {
                const u = p.ultimos[0];
                return `${saludo} 😊\n\nConfirmamos de recibido su pago de *${dinero(u.pagada)}* por ${({ 'Mensualidad': 'la mensualidad', 'Inscripción': 'la inscripción', 'Material': 'el material' })[u.concepto] || u.concepto} de ${nombre} (${fDia(u.fecha)}).${p.adeudo > 0 ? `\n\nSaldo pendiente: ${dinero(p.adeudo)}.` : ''}\n\n¡Muchas gracias! — ${ESCUELA}`;
            }
            return '';
        }

        // ---------- Menú lateral ----------
        function pintarSide() {
            const r = ruta()[0] || 'resumen';
            const debe = DATA.alumnos.filter(a => a.pago && a.pago.adeudo > 0).length;
            const it = (h, ico, txt, act, badge) => `<button class="side-it ${act ? 'act' : ''}" onclick="ir('${h}')"><span style="position:relative">${ico}${badge || ''}</span>${txt}</button>`;
