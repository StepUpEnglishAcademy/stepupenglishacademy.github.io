                <td class="num">${dinero(p.precio)}</td><td class="num">${dinero(p.costo)}</td>
                <td class="num">${dinero(p.precio - p.costo)} <small style="color:var(--text-light)">${p.precio ? Math.round((p.precio - p.costo) / p.precio * 100) : 0}%</small></td>
                <td class="num">${vendidos(p.sku) || '—'}</td>
                <td class="num">${chipStock(p)}</td>
                <td class="acc"><button class="b-pago" title="Registrar compra" data-s="${esc(p.sku)}" onclick="formCompra(this.dataset.s)">📦</button><button class="b-pago" title="Editar" data-s="${esc(p.sku)}" onclick="formProducto(this.dataset.s)">✏️</button></td></tr>`;
            main(`
                <div class="pc-barra">${selMes('TIE_MES', ym)}<div class="grow"></div>
                    <span class="sub" style="margin:0">Periodo:</span>
                    <div class="tabs">${RANGOS.map(([k, t]) => `<button class="tab ${TIE_RANGO === k ? 'sel' : ''}" onclick="TIE_RANGO = ${k}; render()">${k === 1 && ym === hoy().slice(0, 7) ? 'Mes actual' : k === 1 ? 'Solo ' + (fMes(ym) || nombreMes(ym)) : 'Últimos ' + t}</button>`).join('')}</div></div>
                <div class="kpis tie-kpis">
                    ${kpi(dinero(bruto), `vendido · ${periodo}`)}
                    ${kpi(dinero(ganancia), 'ganancia (ya descontado el consumo personal)', ganancia < 0 ? '#c0392b' : '#1e8449')}
                    ${kpi(suma(ventas, 'piezas'), 'piezas vendidas')}
                    ${kpi(`${suma(cons, 'piezas')} · ${dinero(suma(cons, 'costo'))}`, 'consumo personal (piezas · costo)')}
                </div>
                <div class="gas-layout">
                    <div class="res-card tabla-caja" style="padding:0">
                        <table class="tabla compacta" style="box-shadow:none;border-radius:0">
                            <thead><tr><th>Producto</th><th class="num">Precio</th><th class="num">Costo</th><th class="num">Ganancia p/p</th><th class="num">Vendidos (${n === 1 ? 'mes' : n + ' meses'})</th><th class="num">Existencia</th><th></th></tr></thead>
                            <tbody>${activos.map(filaP).join('')}
                                ${inact.length ? `<tr style="cursor:pointer" onclick="TIE_INACT = !TIE_INACT; render()"><td colspan="7" class="t-sub" style="text-align:center;margin:0">${TIE_INACT ? '▲ Ocultar' : '▼ Ver'} descontinuados (${inact.length})</td></tr>` : ''}
                                ${TIE_INACT ? inact.map(filaP).join('') : ''}</tbody>
                        </table>
                    </div>
                    <div class="gas-lado">
                        <div class="res-card"><div class="res-tit"><b>⚠️ Por surtir</b><span class="sub" style="margin:0">${bajo} piezas o menos</span></div>
                            ${surtir.length ? surtir.map(p => `<div class="pago-linea"><span>${esc(p.emoji)} ${esc(p.nombre)}</span><b>${chipStock(p)} <button class="pn-borrar" title="Registrar compra" data-s="${esc(p.sku)}" onclick="formCompra(this.dataset.s)">📦</button></b></div>`).join('')
                              : '<p class="ayuda" style="text-align:left;margin:0">✅ Todo tiene existencia.</p>'}
                        </div>
                        <div class="res-card crece"><div class="res-tit"><b>🏆 Más vendidos</b><span class="sub" style="margin:0">${periodo}</span></div>
                            ${top.length ? top.map((x, k) => `<div class="top-fila">
                                <div class="top-txt"><span>${k + 1}. ${esc(x.p.emoji)} ${esc(x.p.nombre)}</span><b>${x.n} pzs <small>· ${dinero(x.g)}</small></b></div>
                                <div class="barra-bg"><div class="barra-fill" style="width:${Math.round(x.n / top[0].n * 100)}%;background:#27ae60"></div></div></div>`).join('')
                              : '<p class="ayuda" style="text-align:left;margin:0">Sin ventas en este periodo.</p>'}
                            ${top.length ? '<p class="ayuda" style="text-align:left;margin:8px 0 0">Piezas vendidas · ganancia que dejaron.</p>' : ''}
                        </div>
                    </div>
                </div>`);
        }


        // ---------- VISTA: inventario en el celular (administrador) ----------
        let INV_INACT = false, INV_Q = '';
        function vistaInventario() {
            if (!esAdmin()) { location.replace('#/vender'); return; }
            if (DESK) { location.replace('#/tienda'); return; }
            header('📦 Inventario', true, tiendaOk() ? `<button class="btn-mini" onclick="formProducto()">➕ Producto</button>` : '');
            if (!tiendaOk()) return vistaVender();
            const bajo = DATA.tienda.stockBajo || 5;
            const ps = DATA.tienda.productos.slice().sort((a, b) => (b.activo - a.activo) || stockVisible(a) - stockVisible(b) || comparar(a.nombre, b.nombre));
            const activos = ps.filter(p => p.activo), inact = ps.filter(p => !p.activo);
            const surtir = activos.filter(p => stockVisible(p) <= bajo).length;
            const fila = p => { const st = stockVisible(p);
                return `<div class="fila inv-fila ${p.activo ? '' : 'inactivo'}" data-n="${esc(sinAcentos(p.nombre))}" style="cursor:default">
                    <span class="inv-emoji">${esc(p.emoji)}</span>

                    <span class="estado-chip" style="${estiloEst(st <= 0 ? 'vencido' : st <= bajo ? 'pronto' : 'ok')}">${st <= 0 ? (st < 0 ? st : 'Agotado') : st}</span>

                <button class="btn-main btn-verde" style="margin-bottom:12px" onclick="formCompra()">📦 Registrar compra de mercancía</button>

                <div class="buscador" style="margin-bottom:12px">

                </div>
                <div class="lista" style="margin-top:0">${activos.map(fila).join('')}</div>
                ${inact.length ? `<p class="ayuda"><span class="link-pin" onclick="INV_INACT = !INV_INACT; render()">${INV_INACT ? 'Ocultar' : 'Ver'} descontinuados (${inact.length})</span></p>` : ''}
                ${INV_INACT && inact.length ? `<div class="lista" style="margin-top:0">${inact.map(fila).join('')}</div>` : ''}
                <p class="ayuda">📦 registra mercancía comprada · ✏️ cambia precio, costo o nombre<br>Existencia = compras − ventas − consumo personal</p>`);
            filtrarInv();
        }
        function filtrarInv() {
            const t = sinAcentos(INV_Q.trim());
            document.querySelectorAll('.inv-fila').forEach(f => f.style.display = !t || f.dataset.n.includes(t) ? '' : 'none');
        }

        let PROD_EDIT = '';
        const EMOJIS_PROD = ['🍟', '🍪', '🍫', '🍬', '🥤', '🧃', '💧', '🍇', '🍓', '🥜', '🌶️', '🍥', '🍩', '🧁', '🍭', '🍿', '🥨', '🍌', '🍎', '🔥', '💙', '🪱', '📊', '🛍️'];
        function formProducto(sku) {
            const p = sku ? producto(sku) : null;
            PROD_EDIT = sku || '';
            $('modalIn').innerHTML = `
                <h2>${p ? '✏️ Editar producto' : '➕ Nuevo producto'}</h2>
                <div class="campo"><label>Nombre</label><input id="prNom" type="text" value="${esc(p ? p.nombre : '')}" placeholder="Ej. Takis"></div>
                <div class="campo"><label>Emoji</label><input id="prEmo" type="text" value="${esc(p ? p.emoji : '🛍️')}" style="font-size:1.4rem">
                    <div class="emo-ops">${EMOJIS_PROD.map(e => `<button onclick="$('prEmo').value = '${e}'">${e}</button>`).join('')}</div></div>
                <div class="dos">
                    <div class="campo"><label>Precio de venta</label><input id="prPrecio" inputmode="decimal" value="${p ? p.precio : ''}" placeholder="$0"></div>
                    <div class="campo"><label>Costo por pieza</label><input id="prCosto" inputmode="decimal" value="${p ? p.costo : ''}" placeholder="$0"></div>
                </div>
                ${p ? `<label class="check"><input type="checkbox" id="prActivo" ${p.activo ? 'checked' : ''}> <span>Se vende (desmárcalo si ya no lo vendes; su historial se conserva)</span></label>` : ''}
                <button class="btn-main btn-verde" onclick="guardarProductoForm()">💾 Guardar</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>`;
            $('modal').classList.add('show');
        }
        async function guardarProductoForm() {
            const d = { accion: 'guardarProducto', sku: PROD_EDIT, nombre: $('prNom').value.trim(), emoji: $('prEmo').value.trim() || '🛍️',
                        precio: aNum($('prPrecio').value), costo: aNum($('prCosto').value) || 0, activo: $('prActivo') ? $('prActivo').checked : true };
            if (!d.nombre) return alert('Escribe el nombre.');
            if (!d.precio || d.precio <= 0) return alert('Revisa el precio.');
            if (!(await enviar(d))) return;
            toast('✅ Producto guardado'); render();
        }
        function formCompra(sku) {
            const ps = DATA.tienda.productos.filter(p => p.activo || p.sku === sku);
            $('modalIn').innerHTML = `
                <h2>📦 Registrar compra de mercancía</h2>
                <div class="campo"><label>Producto</label><select id="coSku" onchange="$('coCosto').value = (producto(this.value) || {}).costo || ''">
                    ${ps.map(p => `<option value="${esc(p.sku)}" ${p.sku === sku ? 'selected' : ''}>${esc(p.emoji)} ${esc(p.nombre)}</option>`).join('')}</select></div>
                <div class="dos">
                    <div class="campo"><label>Piezas compradas</label><input id="coCant" inputmode="numeric" placeholder="Ej. 24"></div>
                    <div class="campo"><label>Fecha</label><input id="coFecha" type="date" value="${hoy()}"></div>
                </div>
                <div class="campo"><label>Costo por pieza</label><input id="coCosto" inputmode="decimal" value="${(producto(sku || (ps[0] || {}).sku) || {}).costo || ''}"></div>
                <p class="ayuda" style="text-align:left;margin-top:-4px">Si cambió el costo, se actualiza en el producto para calcular bien la ganancia de las próximas ventas.</p>
                <button class="btn-main btn-verde" onclick="guardarCompra()">💾 Guardar compra</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>`;
            $('modal').classList.add('show');
            setTimeout(() => $('coCant').focus(), 50);

        async function guardarCompra() {
            const d = { accion: 'registrarEntrada', sku: $('coSku').value, cantidad: aNum($('coCant').value), fecha: $('coFecha').value, costo: aNum($('coCosto').value) };
            if (!d.cantidad || d.cantidad <= 0) return alert('Escribe cuántas piezas compraste.');
            if (!d.fecha) return alert('Elige la fecha.');
            if (!(await enviar(d))) return;
            toast('✅ Compra registrada'); render();
        }
        async function borrarCompra(i) {
            const e = TIE_COMPRAS[i];
            if (!confirm(`¿Borrar esta compra?\n\n${e.cantidad} pzs de ${(producto(e.sku) || {}).nombre || e.producto} (${fFecha(e.fecha)})`)) return;

        // =====================================================================
        //  ACTIVIDADES EXTRA (summer camps, talleres…) — solo administrador
        // =====================================================================
        const actsData = () => DATA.actividades || { actividades: [], inscritos: [] };
        const actividad = id => actsData().actividades.find(a => a.id === id) || null;
        const inscritosDe = id => actsData().inscritos.filter(i => i.act === id).sort((x, y) => comparar(x.nino, y.nino));
        const gastosAct = id => fin().gastos.filter(g => g.actividad === id).sort((x, y) => x.fecha < y.fecha ? 1 : -1);
        function arreglarTalla(t) {
            t = String(t == null ? '' : t).trim();
            if (!/GMT|\d{4}-\d{2}-\d{2}T\d{2}:/.test(t)) return t;
            const d = new Date(t.replace(/\s*\(.*\)$/, ''));
            return isNaN(d) ? t : [d.getDate(), d.getMonth() + 1].sort((x, y) => x - y).join('-');
        }
        const playerasAct = id => ((DATA.playeras || {}).ventas || []).filter(v => v.act === id);
        const TIPOS_ACT = ['Summer camp', 'Taller', 'Curso', 'Evento', 'Otro'];
        const ICO_ACT = { 'Summer camp': '☀️', 'Taller': '🎨', 'Curso': '📘', 'Evento': '🎉', 'Otro': '⭐' };
        function fechasAct(a) {
            if (!a.fin || a.fin === a.inicio) return fFecha(a.inicio);
            return `${fCorta(a.inicio)} – ${fCorta(a.fin)}`;
        }
        function statsAct(id) {
            const ins = inscritosDe(id), gastos = gastosAct(id).reduce((t, g) => t + g.monto, 0);
            const total = ins.reduce((t, i) => t + i.total, 0), pagado = ins.reduce((t, i) => t + i.pagado, 0);
            const pl = playerasAct(id);
            return { ins, n: ins.length, alumnos: ins.filter(i => i.idAlumno).length, total, pagado, porCobrar: Math.max(0, total - pagado), gastos,
                     ganancia: pagado - gastos, playeras: pl.length };
        }

        // ---- Edad de los niños ----
        // Edad cumplida hoy a partir de la fecha de nacimiento 'yyyy-mm-dd'
        function edadDe(c) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(String(c || ''))) return '';
            const h = hoy();
            let e = Number(h.slice(0, 4)) - Number(c.slice(0, 4));
            if (h.slice(5) < c.slice(5)) e--;
            return e >= 0 ? e : '';
        }
        const txtEdad = e => e === '' || e == null ? '' : e + (Number(e) === 1 ? ' año' : ' años');
        // Todos los niños que se pueden inscribir: alumnos activos e inactivos, y niños que ya vinieron a otra actividad
        function listaNinos() {
            if (DATA.ninos) return DATA.ninos;
            // (si el Apps Script todavía no está actualizado, solo salen los alumnos activos)
            return DATA.alumnos.map(a => ({ id: a.id, nombre: a.alumno, edad: a.cumple ? edadDe(a.cumple) : (a.edad === '' ? '' : Number(a.edad)),
                cumple: a.cumple, tutor: a.padre, telefono: a.telefono || '', activo: true, alumno: true }));
        }
        function edadInscrito(i) {
            if (i.cumple) return edadDe(i.cumple);
            const n = listaNinos().find(x => i.idAlumno ? x.id === i.idAlumno : x.nombre === i.nino);
            return n ? n.edad : '';
        }

        let ACT_SEL = '', ACT_INS = [], ACT_GAS = [];
        function vistaActividades(id) {
            if (!esAdmin()) { location.replace('#/'); return; }
            const lista = actsData().actividades.slice().sort((a, b) => (a.estado === 'Terminada') - (b.estado === 'Terminada') || (a.inicio < b.inicio ? 1 : -1));
            if (id && !actividad(id)) id = '';
            if (DESK && !id && lista.length) id = ACT_SEL && actividad(ACT_SEL) ? ACT_SEL : lista[0].id;
            ACT_SEL = id || '';
            header('🎉 Actividades', !DESK, !DESK && id ? '' : `<button class="btn-mini" onclick="formActividad()">➕ Actividad</button>`);
            if (DESK) lleno();
            const tarjeta = a => { const st = statsAct(a.id);
                return `<div class="act-card ${a.id === id ? 'sel' : ''} ${a.estado === 'Terminada' ? 'terminada' : ''}" data-id="${esc(a.id)}" onclick="ir('#/actividades/' + encodeURIComponent(this.dataset.id))">
                    <div class="act-ico">${ICO_ACT[a.tipo] || '⭐'}</div>

                    <div class="act-gan"><b style="color:${st.ganancia < 0 ? '#c0392b' : '#1e8449'}">${dinero(st.ganancia)}</b><span class="t-sub">ganancia</span></div>
                </div>`; };
            const vacio = '<div class="vacio">Todavía no tienes actividades.<br>Crea la primera con <b>➕ Actividad</b>.</div>';
            if (!DESK) return main(id ? detalleAct(id) : (lista.length ? `<div class="act-lista">${lista.map(tarjeta).join('')}</div>` : vacio));
            main(`<div class="act-layout">
                <div class="res-card act-col">${lista.length ? lista.map(tarjeta).join('') : vacio}</div>
                <div class="act-det">${id ? detalleAct(id) : ''}</div>
            </div>`);
        }

        function detalleAct(id) {
            const a = actividad(id), st = statsAct(id);
            ACT_INS = st.ins; ACT_GAS = gastosAct(id);
            const pl = playerasAct(id);
            const playeraDe = i => pl.find(v => v.nombre === i.nino);
            const edadHtml = i => { const e = edadInscrito(i); return e === '' ? '' : `<span class="edad-chip">${txtEdad(e)}</span>`; };
            const merchTxt = p => `${ICO_MERCH[tipoDe(p)] || '👕'} ${esc(p.talla)}`;
            return `
                <div class="res-card">
                    <div class="act-tit">
                        <div class="act-ico grande">${ICO_ACT[a.tipo] || '⭐'}</div>
                        <div class="grow"><div class="pn-nom">${esc(a.nombre)}</div>
                            <div class="sub">${esc(a.tipo)} · ${fechasAct(a)} · ${a.cobro === 'Por día' ? dinero(a.precio) + ' por día' : dinero(a.precio) + ' por niño'}${a.estado === 'Terminada' ? ' · <b>Terminada</b>' : ''}</div>
                            ${a.notas ? `<div class="sub">${esc(a.notas)}</div>` : ''}</div>
                        <button class="btn-mini" onclick="formActividad('${esc(a.id)}')">✏️ Editar</button>
                    </div>
                    <div class="kpis act-kpis">
                        ${kpi(st.n, `inscritos · ${st.alumnos} alumno${st.alumnos === 1 ? '' : 's'}, ${st.n - st.alumnos} nuevo${st.n - st.alumnos === 1 ? '' : 's'}`)}
                        ${kpi(dinero(st.pagado), `cobrado de ${dinero(st.total)}`)}
                        ${kpi(dinero(st.porCobrar), 'por cobrar', st.porCobrar ? '#c0392b' : '')}
                        ${kpi(dinero(st.gastos), 'gastos')}
                        ${kpi(dinero(st.ganancia), 'ganancia (cobrado − gastos)', st.ganancia < 0 ? '#c0392b' : '#1e8449')}
                    </div>
                </div>
                <div class="res-card act-ins">
                    <div class="res-tit"><b>Niños inscritos</b><span class="sub" style="margin:0">${st.n}</span><div class="grow"></div><button class="btn-mini btn-cola" onclick="formInscrito('${esc(a.id)}')">➕ Inscribir niño</button></div>
                    ${st.ins.length && !DESK ? `<div class="lista" style="margin-top:0;box-shadow:none">${st.ins.map((i, k) => { const p = playeraDe(i), debe = i.total - i.pagado;
                        return `<div class="fila" style="cursor:default;padding:12px 4px">
                            <span class="fila-nom">${esc(i.nino)}${edadHtml(i)} ${i.idAlumno ? '' : '<span class="chip chip-nuevo">Nuevo</span>'}<br>

                                <td>${p ? `${merchTxt(p)} ${p.pagado >= p.precio ? '' : '<small class="rojo">debe</small>'} ${p.entregada ? '✅' : '<small style="color:#b9770e">por entregar</small>'}` : '—'}</td>
                                <td class="acc">${waNumero(i.telefono) && debe > 0 ? `<button class="b-wa" title="Recordar pago" onclick="recordarAct(${k})">💬</button>` : ''}<button class="b-pago" title="Editar / registrar pago" onclick="formInscrito('${esc(a.id)}', ${k})">✏️</button><button class="b-borrar" title="Quitar" onclick="quitarInscrito(${k})">✕</button></td></tr>`; }).join('')}</tbody></table></div>`

                    ${ACT_GAS.length ? `<div class="act-gas-lista">${ACT_GAS.map((g, k) => `<div class="pago-linea"><span>${fFecha(g.fecha)} · ${esc(g.concepto.replace(a.nombre + ': ', ''))}</span><b>${dinero(g.monto)} <button class="pn-borrar" title="Borrar" onclick="borrarGastoUI(${k}, ACT_GAS)">✕</button></b></div>`).join('')}</div>`

        function formActividad(id) {

        async function borrarActividadUI(id) {

        // ---- Inscribir / editar niño ----

        let INS = null;
        function formInscrito(actId, k) {

            const etq = n => [txtEdad(n.edad), n.alumno ? (n.activo ? 'Alumno' : 'Alumno inactivo') : 'Vino a otra actividad'].filter(Boolean).join(' · ');
            const tipoPl = pl ? tipoDe(pl) : 'Playera';
            const tallas = (pl && !py.tallas.includes(pl.talla) ? [pl.talla] : []).concat(py.tallas);

            $('modalIn').innerHTML = `

                        <input id="insBusca" list="listaNinosIns" placeholder="Escribe para buscar…" autocomplete="off" oninput="elegirNinoIns(this.value)">
                        <datalist id="listaNinosIns">${ninos.map(n => `<option value="${esc(n.nombre)}">${esc(etq(n))}</option>`).join('')}</datalist></div>
                    <div id="insInfo"></div>
                </div>
                <div id="insDatos" style="${i ? '' : 'display:none'}">
                    <div class="campo"><label>Nombre del niño</label><input id="insNom" type="text" autocapitalize="words" value="${esc(i ? i.nino : '')}"></div>
                    <div class="dos" id="insCumpleBox" style="${i && i.idAlumno ? 'display:none' : ''}">
                        <div class="campo"><label>Fecha de nacimiento</label><input id="insCumple" type="date" value="${esc(i && !i.idAlumno ? i.cumple || '' : '')}" onchange="mostrarEdadIns()"></div>
                        <div class="campo"><label>Edad</label><input id="insEdad" type="text" readonly tabindex="-1" style="background:#f3f5f6"></div>
                    </div>
                    <div class="dos">
                        <div class="campo"><label>Mamá / papá</label><input id="insTutor" type="text" autocapitalize="words" value="${esc(i ? i.tutor : '')}"></div>
                        <div class="campo"><label>Teléfono</label><input id="insTel" inputmode="tel" value="${esc(i ? i.telefono : '')}"></div>
                    </div>
                </div>
                <div class="dos">
                    ${a.cobro === 'Por día' ? `<div class="campo"><label>Días</label><input id="insDias" inputmode="numeric" value="${i ? i.dias : 1}" oninput="$('insTotal').value = (aNum(this.value) || 0) * ${a.precio}"></div>` : ''}
                    <div class="campo"><label>Total a pagar</label><input id="insTotal" inputmode="decimal" value="${i ? i.total : a.precio}" oninput="${i ? '' : "$('insPag').value = this.value"}"></div>
                    <div class="campo"><label>Pagó</label><input id="insPag" inputmode="decimal" value="${i ? i.pagado : a.precio}"></div>
                </div>
                ${pl ? `<div class="campo" style="margin-bottom:4px"><label>👕 Merch</label></div><input type="checkbox" id="insPl" checked hidden>`
                  : `<label class="check"><input type="checkbox" id="insPl" onchange="$('insPlDatos').style.display = this.checked ? '' : 'none'"> <span>Compró merch (playera o sudadera)</span></label>`}
                <div id="insPlDatos" style="${pl ? '' : 'display:none'}">
                    <div class="dos">
                        <div class="campo"><label>Tipo</label><select id="insPlTipo" onchange="$('insPlPrecio').value = precioMerch(this.value) || ''">${TIPOS_MERCH.map(t => `<option ${t === tipoPl ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
                        <div class="campo"><label>Talla</label><select id="insPlTalla">${tallas.map(t => `<option ${pl && pl.talla === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
                    </div>
                    <div class="campo"><label>Precio</label><input id="insPlPrecio" inputmode="decimal" value="${pl ? pl.precio : (precioMerch(tipoPl) || '')}"></div>
                    <label class="check"><input type="checkbox" id="insPlPag" ${!pl || estaPagada(pl) ? 'checked' : ''}> <span>Ya la pagó${parcial ? ` <small>(lleva ${dinero(pl.pagado)})</small>` : ''}</span></label>
                    <label class="check"><input type="checkbox" id="insPlEnt" ${pl && pl.entregada ? 'checked' : ''}> <span>Ya se le entregó</span></label>
                </div>
                <div class="campo"><label>Notas (opcional)</label><input id="insNotas" type="text" value="${esc(i ? i.notas : '')}"></div>
                <button class="btn-main btn-verde" onclick="guardarInscritoForm()">💾 Guardar</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>
                ${i ? `<button class="btn-rojo-txt" onclick="quitarInscrito(${k})">Quitar de la actividad</button>` : ''}`;
            $('modal').classList.add('show');
            mostrarEdadIns();
            if (!i) setTimeout(() => $('insBusca') && $('insBusca').focus(), 50);
        }
        function mostrarEdadIns() {
            const c = $('insCumple'), e = $('insEdad');
            if (c && e) e.value = c.value ? (txtEdad(edadDe(c.value)) || 'Revisa la fecha') : '';
        }
        function tipoIns(nuevo) {
            INS.nuevo = nuevo; INS.idAlumno = ''; INS.elegido = null;
            $('tAl').classList.toggle('sel', !nuevo); $('tNu').classList.toggle('sel', nuevo);
            $('insBuscaBox').style.display = nuevo ? 'none' : '';
            $('insDatos').style.display = nuevo ? '' : 'none';
            $('insCumpleBox').style.display = '';
            $('insBusca').value = ''; $('insInfo').innerHTML = '';
            ['insNom', 'insTutor', 'insTel', 'insCumple'].forEach(x => $(x).value = '');
            mostrarEdadIns();
            if (nuevo) $('insNom').focus();
        }
        function elegirNinoIns(nombre) {
            const n = listaNinos().find(x => x.nombre === nombre);
            INS.elegido = n || null; INS.idAlumno = n && n.alumno ? n.id : '';
            if (!n) { $('insDatos').style.display = 'none'; $('insInfo').innerHTML = ''; return; }
            $('insNom').value = n.nombre; $('insTutor').value = n.tutor || ''; $('insTel').value = n.telefono || ''; $('insCumple').value = n.cumple || '';
            $('insCumpleBox').style.display = n.alumno ? 'none' : '';
            $('insDatos').style.display = '';
            const ya = inscritosDe(INS.act).some(x => sinAcentos(x.nino) === sinAcentos(n.nombre));
            $('insInfo').innerHTML = `<div class="aviso" style="text-align:left;margin:-4px 0 12px;background:#eef6ff;color:#1f3a5f">👦 <b>${txtEdad(n.edad) || 'Sin fecha de nacimiento'}</b> · ${n.alumno ? (n.activo ? 'Alumno activo' : 'Alumno inactivo') : 'Vino a otra actividad'}${ya ? '<br>⚠️ Ya está inscrito en esta actividad' : ''}</div>`;
            mostrarEdadIns();
        }
        async function guardarInscritoForm() {
            const nino = $('insNom').value.trim();
            if (!INS.fila && !INS.nuevo && !INS.elegido) return alert('Elige al niño de la lista (o cambia a "Niño nuevo").');
            if (!nino) return alert('Escribe el nombre del niño.');
            const cumple = INS.idAlumno ? '' : $('insCumple').value;
            if (cumple && edadDe(cumple) === '') return alert('Revisa la fecha de nacimiento.');
            if (INS.nuevo && !cumple && !confirm('No pusiste la fecha de nacimiento, así que no se sabrá su edad. ¿Guardar así?')) return;
            if (!INS.fila && inscritosDe(INS.act).some(x => sinAcentos(x.nino) === sinAcentos(nino)) && !confirm(`${nino} ya está inscrito en esta actividad. ¿Inscribirlo otra vez?`)) return;
            const inscrito = { fila: INS.fila, act: INS.act, nino, idAlumno: INS.idAlumno, tutor: $('insTutor').value.trim(), telefono: $('insTel').value, cumple,
                dias: $('insDias') ? aNum($('insDias').value) : '', total: aNum($('insTotal').value) || 0, pagado: aNum($('insPag').value) || 0, notas: $('insNotas').value.trim() };
            if (inscrito.pagado > inscrito.total && !confirm('Pagó más del total. ¿Guardar así?')) return;
            if ($('insPl') && $('insPl').checked) {
                const precio = aNum($('insPlPrecio').value) || 0, pl = INS.pl, parcial = pl && pl.pagado > 0 && pl.pagado < pl.precio;
                inscrito.merch = { tipo: $('insPlTipo').value, talla: $('insPlTalla').value, precio, entregada: $('insPlEnt').checked };
                if ($('insPlPag').checked) inscrito.merch.pagada = true;
                else if (parcial) inscrito.merch.pagado = pl.pagado;     // conserva lo que ya había abonado
                else inscrito.merch.pagada = false;
                if (pl) Object.assign(inscrito.merch, { fila: pl.fila, nombreAnterior: pl.nombre, fecha: pl.fecha });
            }
            if (!(await enviar({ accion: 'guardarInscrito', inscrito }))) return;
            toast(INS.fila ? '✅ Datos actualizados' : '✅ Niño inscrito'); render();
        }
        async function quitarInscrito(k) {
            const i = ACT_INS[k];
            if (!confirm(`¿Quitar a ${i.nino} de esta actividad?\n\nSi compró merch, esa venta se queda en 👕 Merch.`)) return;
            if (!(await enviar({ accion: 'borrarInscrito', fila: i.fila, act: i.act, nino: i.nino }))) return;
            toast('Inscripción quitada'); render();
        }
        function recordarAct(k) {
            const i = ACT_INS[k], a = actividad(i.act);
            const saludo = i.tutor ? `Hola ${i.tutor.split(' ')[0]}` : 'Hola';
            abrirWhatsApp(waNumero(i.telefono), `${saludo}, ¿cómo está? 😊\n\nLe recordamos que queda pendiente un saldo de *${dinero(i.total - i.pagado)}* de ${i.nino.split(' ')[0]} por ${a.nombre}.${datosPago()}\n\n¡Muchas gracias! — ${ESCUELA}`);
        }
        function formGastoAct(actId) {
            const a = actividad(actId);
            $('modalIn').innerHTML = `
                <h2>➕ Gasto de ${esc(a.nombre)}</h2>
                <div class="dos">
                    <div class="campo"><label>Fecha</label><input id="gaFecha" type="date" value="${hoy()}"></div>
                    <div class="campo"><label>Monto</label><input id="gaMonto" inputmode="decimal" placeholder="$0"></div>
                </div>
                <div class="campo"><label>Concepto</label><input id="gaConc" type="text" placeholder="Ej. Material, inflable, pago a quien lo imparte"></div>
                <p class="ayuda" style="text-align:left;margin-top:-4px">Se guarda en 💸 Gastos (categoría Actividades) y se resta de la ganancia de esta actividad.</p>
                <button class="btn-main btn-verde" onclick="guardarGastoAct('${esc(a.id)}')">💾 Guardar gasto</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>`;
            $('modal').classList.add('show');
        }
        async function guardarGastoAct(actId) {
            const a = actividad(actId);
            const gasto = { fecha: $('gaFecha').value, categoria: 'Actividades', concepto: `${a.nombre}: ${$('gaConc').value.trim() || 'Gasto'}`, monto: aNum($('gaMonto').value), actividad: actId };
            if (!gasto.fecha) return alert('Elige la fecha.');
            if (!gasto.monto || gasto.monto <= 0) return alert('Escribe el monto.');
            if (!(await enviar({ accion: 'guardarGasto', gasto }))) return;
            toast('✅ Gasto guardado'); render();
        }

        // =====================================================================
        //  MERCH DE LA ESCUELA (playeras y sudaderas) — inventario por tipo y talla
        // =====================================================================
        const TIPOS_MERCH = ['Playera', 'Sudadera'];
        const ICO_MERCH = { Playera: '👕', Sudadera: '🧥' };
        const tipoDe = v => v.tipo || 'Playera';
        const cfgMerch = t => { const py = DATA.playeras || {}; return (py.precios || {})[t] || (t === 'Playera' ? { precio: py.precio, costo: py.costo } : {}) || {}; };
        const precioMerch = t => Number(cfgMerch(t).precio) || 0;
        const costoMerch = t => Number(cfgMerch(t).costo) || 0;
        // Solo se marca como pagada cuando ya pagó el precio completo
        const estaPagada = v => v.pagada != null ? !!v.pagada : (v.pagado > 0 && v.pagado >= v.precio);
        // Casilla de pago: ✓ verde si ya pagó, puntito gris si no. Se marca/desmarca con un toque.
        function chkPago(k, v) {
            if (!v.precio) return '<span class="t-sub" style="display:inline;margin:0">Sin costo</span>';
            const ok = estaPagada(v), parcial = !ok && v.pagado > 0;
            return `<button class="pago-chk ${ok ? 'on' : ''}" title="${ok ? 'Pagada · toca para desmarcar' : 'Sin pagar · toca cuando pague'}" onclick="event.stopPropagation(); togglePagoMerch(${k})">${ok ? '✓' : ''}</button>${parcial ? ` <small class="rojo">lleva ${dinero(v.pagado)}</small>` : ''}`;
        }

        let PL_LISTA = [], MERCH_FILTRO = '';
        function stockMerch() {
            const py = DATA.playeras || { ventas: [], compras: [], tallas: [] }, st = {};
            const de = (t, ta) => { const x = t + '|' + ta; return st[x] = st[x] || { tipo: t, talla: ta, compradas: 0, vendidas: 0 }; };
            TIPOS_MERCH.forEach(t => (py.tallas || []).forEach(ta => de(t, ta)));
            (py.compras || []).forEach(c => de(tipoDe(c), c.talla).compradas += c.cantidad);
            (py.ventas || []).forEach(v => de(tipoDe(v), v.talla).vendidas++);
            return Object.values(st);
        }
        function vistaPlayeras() {
            if (!esAdmin()) { location.replace('#/'); return; }
            const py = DATA.playeras || { ventas: [], compras: [], tallas: [] };
            header('👕 Merch', !DESK, `<button class="btn-mini" onclick="formVentaPlayera()">➕${DESK ? ' Venta' : ''}</button><button class="btn-mini" onclick="formCompraPlayeras()">📦${DESK ? ' Compra' : ''}</button><button class="btn-mini" onclick="formConfigPlayeras()">⚙️</button>`);
            if (DESK) lleno();
            const st = stockMerch();
            // Las sudaderas aparecen en cuanto tengan alguna compra o venta
            const tiposVis = TIPOS_MERCH.filter(t => t === 'Playera' || st.some(x => x.tipo === t && (x.compradas || x.vendidas)));
            PL_LISTA = (py.ventas || []).filter(v => !MERCH_FILTRO || tipoDe(v) === MERCH_FILTRO)
                .sort((a, b) => (a.entregada - b.entregada) || (a.fecha < b.fecha ? 1 : -1));
            const porEntregar = PL_LISTA.filter(v => !v.entregada).length, porCobrar = PL_LISTA.reduce((t, v) => t + Math.max(0, v.precio - v.pagado), 0);
            const tile = x => { const ex = x.compradas - x.vendidas;
                return `<div class="kpi pl-talla"><span>Talla ${esc(x.talla)}</span><b style="color:${ex <= 0 ? '#c0392b' : ex <= 2 ? '#b9770e' : ''}">${ex}</b><span>en existencia · ${x.vendidas} vendida${x.vendidas === 1 ? '' : 's'}</span></div>`; };
            main(`
                ${tiposVis.map(t => `<div class="merch-tipo">${tiposVis.length > 1 ? `<div class="pn-sec" style="margin:0 0 8px">${ICO_MERCH[t]} ${t}s</div>` : ''}
                    <div class="pl-tallas">${st.filter(x => x.tipo === t).map(tile).join('')}</div></div>`).join('')}
                ${tiposVis.length < TIPOS_MERCH.length ? '<p class="ayuda" style="text-align:left;margin:-6px 0 12px">🧥 Las sudaderas aparecen aquí en cuanto registres su primera compra (📦 Compra → Sudadera).</p>' : ''}
                ${!precioMerch('Playera') ? '<div class="aviso" style="margin:0 0 12px">⚙️ Pon el precio de la playera (y de la sudadera) con el botón ⚙️ para que se llene solo al vender.</div>' : ''}
                <div class="res-card pl-ventas">
                    <div class="res-tit"><b>Ventas</b><span class="sub" style="margin:0">${porEntregar} por entregar · ${dinero(porCobrar)} por cobrar</span><div class="grow"></div>
                        <div class="tabs">${[['', 'Todo'], ['Playera', '👕 Playeras'], ['Sudadera', '🧥 Sudaderas']].map(([v, t]) => `<button class="tab tab-ch ${MERCH_FILTRO === v ? 'sel' : ''}" onclick="MERCH_FILTRO = '${v}'; render()">${t}</button>`).join('')}</div></div>
                    ${PL_LISTA.length && !DESK ? `<div class="lista" style="margin-top:0;box-shadow:none">${PL_LISTA.map((v, k) => `<div class="fila" style="cursor:default;padding:12px 4px">
                            ${chkPago(k, v)}
                            <span class="fila-nom">${esc(v.nombre)}<br><span class="res-grupo">${ICO_MERCH[tipoDe(v)]} ${esc(tipoDe(v))} ${esc(v.talla)} · ${v.fecha ? fFecha(v.fecha) : 'Historial'}${v.act && actividad(v.act) ? ' · 🎉 ' + esc(actividad(v.act).nombre) : ''}</span></span>
                            ${v.entregada ? '<span title="Entregada">📦✅</span>' : `<button class="btn-mini" onclick="entregarPlayera(${k})">Entregar</button>`}
                            <button class="inv-btn gris" onclick="formVentaPlayera(${k})">✏️</button></div>`).join('')}</div>`
                    : PL_LISTA.length ? `<div class="tabla-caja"><table class="tabla compacta" style="box-shadow:none">
                        <thead><tr><th>Fecha</th><th>Nombre</th><th>Tipo</th><th>Talla</th><th class="num">Precio</th><th style="text-align:center">Pagó</th><th>Entrega</th><th></th></tr></thead>
                        <tbody>${PL_LISTA.map((v, k) => `<tr style="cursor:default"><td style="white-space:nowrap">${v.fecha ? fFecha(v.fecha) : '<span class="t-sub" style="margin:0">Historial</span>'}</td>
                            <td><b>${esc(v.nombre)}</b>${v.act && actividad(v.act) ? `<span class="t-sub">🎉 ${esc(actividad(v.act).nombre)}</span>` : ''}</td>
                            <td style="white-space:nowrap">${ICO_MERCH[tipoDe(v)]} ${esc(tipoDe(v))}</td><td>${esc(v.talla)}</td><td class="num">${dinero(v.precio)}</td>
                            <td style="text-align:center;white-space:nowrap">${chkPago(k, v)}</td>
                            <td>${v.entregada ? '✅ Entregada' : `<button class="btn-mini" onclick="entregarPlayera(${k})">📦 Entregar</button>`}</td>
                            <td class="acc"><button class="b-pago" title="Editar" onclick="formVentaPlayera(${k})">✏️</button><button class="b-borrar" title="Borrar" onclick="borrarPlayeraUI(${k})">✕</button></td></tr>`).join('')}</tbody></table></div>`
                      : '<div class="vacio" style="padding:30px 10px">Sin ventas registradas.</div>'}
                </div>`);
        }
        async function togglePagoMerch(k) {
            const v = PL_LISTA[k], pagada = !estaPagada(v);
            if (!(await enviar({ accion: 'pagoMerch', fila: v.fila, nombre: v.nombre, pagada }))) return;
            toast(pagada ? '✅ Marcada como pagada' : 'Marcada como no pagada'); render();
        }
        function formVentaPlayera(k) {
            const v = k != null ? PL_LISTA[k] : null, py = DATA.playeras;
            const ninos = listaNinos().slice().sort((x, y) => comparar(x.nombre, y.nombre));
            const tipo = v ? tipoDe(v) : 'Playera', parcial = v && !estaPagada(v) && v.pagado > 0;
            $('modalIn').innerHTML = `
                <h2>${v ? '✏️ Editar venta' : '👕 Vender merch'}</h2>
                <div class="campo"><label>Nombre</label><input id="pvNom" list="listaNinosPl" value="${esc(v ? v.nombre : '')}" placeholder="Alumno, maestra o niño de una actividad">
                    <datalist id="listaNinosPl">${ninos.map(n => `<option value="${esc(n.nombre)}">${esc([txtEdad(n.edad), n.alumno ? (n.activo ? 'Alumno' : 'Alumno inactivo') : ''].filter(Boolean).join(' · '))}</option>`).join('')}</datalist></div>
                <div class="dos">
                    <div class="campo"><label>Tipo</label><select id="pvTipo" onchange="$('pvPrecio').value = precioMerch(this.value) || ''">${TIPOS_MERCH.map(t => `<option ${t === tipo ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
                    <div class="campo"><label>Talla</label><select id="pvTalla">${py.tallas.concat(v && !py.tallas.includes(v.talla) ? [v.talla] : []).map(t => `<option ${v && v.talla === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
                </div>
                <div class="dos">
                    <div class="campo"><label>Precio</label><input id="pvPrecio" inputmode="decimal" value="${v ? v.precio : (precioMerch(tipo) || '')}"></div>
                    <div class="campo"><label>Fecha de compra</label><input id="pvFecha" type="date" value="${v ? v.fecha : hoy()}"></div>
                </div>
                ${v && !v.fecha ? '<p class="ayuda" style="margin:-6px 0 10px;text-align:left">Si no sabes la fecha, déjala vacía y se queda como "Historial".</p>' : ''}
                <label class="check"><input type="checkbox" id="pvPag" ${!v || estaPagada(v) ? 'checked' : ''}> <span>Ya pagó${parcial ? ` <small>(lleva ${dinero(v.pagado)}; si no la marcas, se conserva ese abono)</small>` : ''}</span></label>
                <label class="check"><input type="checkbox" id="pvEnt" ${v && v.entregada ? 'checked' : ''}> <span>Ya se entregó</span></label>
                <button class="btn-main btn-verde" onclick="guardarVentaPlForm(${k != null ? k : -1})">💾 Guardar</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>`;
            $('modal').classList.add('show');
        }
        async function guardarVentaPlForm(k) {
            const v = k >= 0 ? PL_LISTA[k] : null;
            const nombre = $('pvNom').value.trim(), n = listaNinos().find(x => x.nombre === nombre && x.alumno);
            const venta = { fila: v ? v.fila : 0, nombreAnterior: v ? v.nombre : '', nombre, idAlumno: n ? n.id : (v ? v.idAlumno : ''), tipo: $('pvTipo').value, talla: $('pvTalla').value,
                precio: aNum($('pvPrecio').value) || 0, entregada: $('pvEnt').checked, act: v ? v.act : '', fecha: $('pvFecha').value, fijarFecha: true };
            if ($('pvPag').checked) venta.pagada = true;
            else if (v && v.pagado > 0 && !estaPagada(v)) venta.pagado = v.pagado;   // conserva el abono
            else venta.pagada = false;
            if (!nombre) return alert('Escribe el nombre.');
            if (!(await enviar({ accion: 'guardarVentaPlayera', venta }))) return;
            toast('✅ Venta guardada'); render();
        }
        async function entregarPlayera(k) {
            const venta = Object.assign({}, PL_LISTA[k], { nombreAnterior: PL_LISTA[k].nombre, entregada: true });
            delete venta.pagada;   // no toca lo pagado
            if (!(await enviar({ accion: 'guardarVentaPlayera', venta }))) return;
            toast('✅ Marcada como entregada'); render();
        }
        async function borrarPlayeraUI(k) {
            const v = PL_LISTA[k];
            if (!confirm(`¿Borrar la venta de ${tipoDe(v).toLowerCase()} de ${v.nombre} (talla ${v.talla})?`)) return;
            if (!(await enviar({ accion: 'borrarVentaPlayera', fila: v.fila, nombre: v.nombre }))) return;
            toast('Venta borrada'); render();
        }
        function formCompraPlayeras() {
            const py = DATA.playeras;
            $('modalIn').innerHTML = `
                <h2>📦 Compra de merch</h2>
                <div class="dos">
                    <div class="campo"><label>Tipo</label><select id="pcTipo" onchange="$('pcCosto').value = costoMerch(this.value) || ''">${TIPOS_MERCH.map(t => `<option>${t}</option>`).join('')}</select></div>
                    <div class="campo"><label>Fecha</label><input id="pcFecha" type="date" value="${hoy()}"></div>
                </div>
                <div class="campo"><label>Costo por pieza</label><input id="pcCosto" inputmode="decimal" value="${costoMerch('Playera') || ''}" placeholder="$0"></div>
                <div class="campo"><label>Piezas por talla</label>
                    <div class="pl-compra">${py.tallas.map((t, k) => `<div><span>${esc(t)}</span><input id="pcT${k}" inputmode="numeric" placeholder="0"></div>`).join('')}</div></div>
                <p class="ayuda" style="text-align:left;margin-top:-4px">Se suma a la existencia y el total se registra en 💸 Gastos (categoría Merch).</p>
                <button class="btn-main btn-verde" onclick="guardarCompraPl()">💾 Guardar compra</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>`;
            $('modal').classList.add('show');
        }
        async function guardarCompraPl() {
            const py = DATA.playeras;
            const items = py.tallas.map((t, k) => ({ talla: t, cantidad: aNum($('pcT' + k).value) || 0 })).filter(x => x.cantidad > 0);
            if (!items.length) return alert('Escribe cuántas piezas compraste de cada talla.');
            if (!(await enviar({ accion: 'compraPlayeras', tipo: $('pcTipo').value, fecha: $('pcFecha').value, costo: aNum($('pcCosto').value) || 0, items }))) return;
            toast('✅ Compra registrada'); render();
        }
        function formConfigPlayeras() {
            const py = DATA.playeras;
            $('modalIn').innerHTML = `
                <h2>⚙️ Merch</h2>
                ${TIPOS_MERCH.map(t => `<div class="pago-sub" style="margin-top:4px">${ICO_MERCH[t]} ${t}</div>
                <div class="dos">
                    <div class="campo"><label>Precio de venta</label><input id="cfPrecio${t}" inputmode="decimal" value="${precioMerch(t) || ''}"></div>
                    <div class="campo"><label>Costo por pieza</label><input id="cfCosto${t}" inputmode="decimal" value="${costoMerch(t) || ''}"></div>
                </div>`).join('')}
                <div class="campo"><label>Tallas (separadas por coma, las mismas para los dos)</label><input id="cfTallas" type="text" value="${esc(py.tallas.join(', '))}"></div>
                <button class="btn-main btn-verde" onclick="guardarConfigPl()">💾 Guardar</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>`;
            $('modal').classList.add('show');
        }
        async function guardarConfigPl() {
            const tallas = $('cfTallas').value.split(',').map(t => t.trim()).filter(Boolean);
            const precios = {};
            TIPOS_MERCH.forEach(t => precios[t] = { precio: aNum($('cfPrecio' + t).value) || 0, costo: aNum($('cfCosto' + t).value) || 0 });
            if (!(await enviar({ accion: 'configPlayeras', precios, precio: precios.Playera.precio, costo: precios.Playera.costo, tallas }))) return;
            toast('✅ Guardado'); render();
        }

        // ---------- Iniciar ----------
        try { const c = lsGet('fichas_cache'); if (c) { const d = JSON.parse(c); if (d.alumnos && d.alumnos[0] && d.alumnos[0].id) { DATA = d; CARGADO = true; } } } catch (e) {}
        window.addEventListener('hashchange', render);
        // Al regresar a la app (estaba en segundo plano), vuelve a leer la hoja si pasó más de 1 minuto
        let ULTIMA_CARGA = 0;
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && Date.now() - ULTIMA_CARGA > 60000 && lsGet('fichas_pin') && !REG && !PAGO_ABIERTO()) cargar();
        });
        ['input', 'change'].forEach(ev => document.addEventListener(ev, e => { const c = e.target.closest && e.target.closest('.campo'); if (c) c.classList.remove('error'); }));
        render();
        cargar();
        if (pendTienda().length) setTimeout(enviarPendientes, 3000);
    </script>
</body>
</html>
