                    ${it('#/calendario', '📅', 'Calendario / Pagos', r === 'calendario', debe ? `<span class="side-badge ico" title="Alumnos con adeudo">${debe}</span>` : '')}
                    ${it('#/grupos', '👥', 'Grupos', ['grupos', 'g', 'r', 'a', 'grupo', 'bajas', 'editar'].includes(r))}
                    ${it('#/maestras', '👩‍🏫', 'Maestras', r === 'maestras')}
                    ${it('#/tienda', '🛍️', 'Tienda', r === 'tienda' || r === 'vender')}
                    ${it('#/actividades', '🎉', 'Actividades', r === 'actividades')}
                    ${it('#/playeras', '👕', 'Merch', r === 'playeras')}
                    ${it('#/gastos', '💸', 'Gastos', r === 'gastos')}
                    ${it('#/vacaciones', '🏖️', 'Vacaciones', r === 'vacaciones')}
                    ${it('#/nuevo', '➕', 'Nuevo alumno', r === 'nuevo')}
                </nav>
                <div class="side-pie">
                    <button class="side-it" onclick="cargar()"><span>🔄</span>Actualizar</button>
                    <div class="side-info">🔑 Administrador<br>
                        <span class="link-pin" onclick="usarModo('movil')">Ver versión celular</span><br>
                        <span class="link-pin" onclick="cambiarPin()">Cambiar PIN</span></div>
                </div>`;
        }

        // Filtros compartidos por el calendario y la cobranza
        let CAL = { mes: '', grupo: '' };
        let PANEL = null;      // { tipo: 'dia', f } | { tipo: 'alumno', id, dia, k }
        const alumnosPC = () => DATA.alumnos.filter(a => a.pago && (!CAL.grupo || a.grupo === CAL.grupo));
        function selectGrupo() {
            const gs = [...new Set(DATA.alumnos.filter(a => a.pago).map(a => a.grupo))].sort(comparar);
            return `<select class="pc-sel" onchange="CAL.grupo = this.value; render()">
                <option value="">Todos los grupos</option>
                ${gs.map(g => `<option ${g === CAL.grupo ? 'selected' : ''} value="${esc(g)}">${esc(g)}</option>`).join('')}</select>`;
        }
        const kpi = (valor, txt, color) => `<div class="kpi"><b style="${color ? 'color:' + color : ''}">${valor}</b><span>${txt}</span></div>`;
        const sinMeses = () => DATA.alumnos.some(a => a.pago && !a.pago.sinDatos) && !DATA.alumnos.some(a => a.pago && a.pago.meses);
        const avisoScript = () => sinMeses() ? '<div class="aviso" style="margin:0 0 12px">⚙️ Para ver el calendario completo, actualiza el Apps Script (Codigo.gs) y publica una nueva versión.</div>' : '';

        // ---------- VISTA: calendario de pagos ----------
        function vistaCalendario() {
            if (!CAL.mes) CAL.mes = hoy().slice(0, 7);
            header('📅 Calendario de pagos', false, '');
            lleno();
            const [y, m] = CAL.mes.split('-').map(Number);
            const al = alumnosPC();
            const porDia = {};
            al.forEach(a => mesesDe(a).filter(x => x.mes === CAL.mes).forEach(x => {
                (porDia[x.vence] = porDia[x.vence] || []).push({ a, e: estadoMes(a, x) });
            }));
            Object.values(porDia).forEach(l => l.sort((x, y2) => ORDEN_EST.indexOf(x.e) - ORDEN_EST.indexOf(y2.e) || comparar(x.a.alumno, y2.a.alumno)));
            const todos = Object.values(porDia).flat();
            const cuenta = (...es) => todos.filter(x => es.includes(x.e));
            const pagados = cuenta('ok', 'parcial').length;
            const vencidos = cuenta('vencido', 'hoy');
            const porVencer = cuenta('pronto', 'futuro').length;
            const adeudo = al.reduce((s2, a) => s2 + (a.pago.adeudo > 0 ? a.pago.adeudo : 0), 0);

            const h = hoy(), primero = (new Date(y, m - 1, 1).getDay() + 6) % 7, nDias = new Date(y, m, 0).getDate();
            const celdas = [];
            for (let i = 0; i < primero; i++) celdas.push('<div class="cal-d vacio-d"></div>');
            const selDia = PANEL && PANEL.tipo === 'dia' ? PANEL.f : (PANEL && PANEL.dia) || '';
            const selId = PANEL && PANEL.tipo === 'alumno' ? PANEL.id : '';
            for (let d = 1; d <= nDias; d++) {
                const f = `${CAL.mes}-${pad2(d)}`, l = porDia[f] || [];
                const MAX = l.length > CAL_MAX ? CAL_MAX - 1 : CAL_MAX, ok = l.filter(x => x.e === 'ok' || x.e === 'parcial').length, vac = enVacaciones(f);
                celdas.push(`<div class="cal-d ${f === h ? 'hoy' : ''} ${f === selDia ? 'sel' : ''} ${vac ? 'vac' : ''}" onclick="verDia('${f}')" ${vac ? `title="${esc(vac.nombre)}"` : ''}>
                    <div class="cal-n"><b>${d}</b>${l.length ? `<span>${ok}/${l.length}</span>` : vac ? '<span>🏖️</span>' : ''}</div>
                    ${l.slice(0, MAX).map(x => `<div class="cal-c ${x.a.id === selId ? 'act' : ''}" style="${estiloEst(x.e)}" title="${esc(x.a.alumno)} · ${esc(x.a.grupo)} · ${EST[x.e].txt}${ultimoContacto(x.a.id) ? ' · Último mensaje: ' + esc(ultimoContacto(x.a.id).tipo) + ' ' + hace(ultimoContacto(x.a.id).fecha) : ''}" data-id="${esc(x.a.id)}" data-dia="${f}" onclick="event.stopPropagation(); abrirPanel(this.dataset.id, this.dataset.dia)">${recienteMsg(x.a.id) ? '💬 ' : ''}${esc(corto(x.a.alumno))}</div>`).join('')}
                    ${l.length > MAX ? `<div class="cal-mas">+${l.length - MAX} más</div>` : ''}
                </div>`);
            }
            const esMesActual = CAL.mes === h.slice(0, 7);
            main(`
                ${avisoScript()}
                <div class="pc-barra">
                    <div class="cal-nav">
                        <button class="flecha" onclick="moverMes(-1)" title="Mes anterior">‹</button>
                        <b>${cap(MESES[m - 1])} ${y}</b>
                        <button class="flecha" onclick="moverMes(1)" title="Mes siguiente">›</button>
                    </div>
                    ${esMesActual ? '' : `<button class="btn-mini" onclick="CAL.mes = hoy().slice(0, 7); render()">Ir a hoy</button>`}
                    <div class="grow"></div>
                    ${botonCola(true)}
                    ${selectGrupo()}
                </div>
                <div class="kpis">
                    ${kpi(`${pagados} de ${todos.length}`, `mensualidades de ${MESES[m - 1]} pagadas`, '#1e8449')}
                    ${kpi(vencidos.length, `vencidas sin pagar · ${dinero(vencidos.reduce((s2, x) => s2 + (x.a.pago.mensualidad || 0), 0))}`, vencidos.length ? '#c0392b' : '')}
                    ${kpi(porVencer, `por vencer en ${MESES[m - 1]}`)}
                    ${kpi(dinero(adeudo), 'adeudo total (todos los meses)', adeudo ? '#c0392b' : '')}
                </div>
                <div class="leyenda">${ORDEN_EST.map(e => `<span style="--c:${EST[e].c}">${EST[e].txt}</span>`).join('')}<b style="font-weight:600">💬 = le escribiste en los últimos 7 días</b>${(DATA.vacaciones || []).length ? '<b style="font-weight:600">🏖️ = vacaciones</b>' : ''}</div>
                <div class="cal" style="grid-template-rows: auto repeat(${Math.ceil((primero + nDias) / 7)}, minmax(0, 1fr))">
                    ${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<div class="cal-h">${d}</div>`).join('')}
                    ${celdas.join('')}
                </div>`);
        }
        const pad2 = n => (n < 10 ? '0' : '') + n;
        // Pantallas de computadora que ocupan exactamente el alto de la ventana (todas terminan a la misma altura)
        const lleno = () => $('main').classList.add('ancho', 'lleno');
        // El calendario se ajusta al alto de la pantalla (sin scroll): alto de cada semana y cuántos nombres caben por día
        let CAL_MAX = 4;
        function ajustarCalendario() {
            const d = document.querySelector('.cal-d:not(.vacio-d)'); if (!d) return false;
            const max = Math.max(1, Math.floor((d.clientHeight - 36) / 21));
            if (max === CAL_MAX) return false;
            CAL_MAX = max;
            return true;
        }
        function moverMes(n) {
            let [y, m] = CAL.mes.split('-').map(Number);
            m += n; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
            CAL.mes = `${y}-${pad2(m)}`; render();
        }
        function verDia(f) { PANEL = { tipo: 'dia', f }; render(); }
        function abrirPanel(id, dia, irMsg) {
            PANEL = { tipo: 'alumno', id, dia: dia || '', k: null };
            render();
            if (irMsg) setTimeout(() => { const e = $('pnMsg'); if (e) e.scrollIntoView({ block: 'start' }); }, 50);
        }
        function cerrarPanel() { PANEL = null; render(); }

        // ---------- Panel derecho ----------
        function pintarPanel() {
            const el = $('panel');
            const a = PANEL && PANEL.tipo === 'alumno' ? alumno(PANEL.id) : null;
            if (!DESK || !PANEL || (PANEL.tipo === 'alumno' && (!a || !a.pago))) {
                PANEL = null; el.classList.remove('open'); document.body.classList.remove('con-panel'); return;
            }
            el.innerHTML = PANEL.tipo === 'dia' ? panelDia(PANEL.f) : panelAlumno(a);
            el.classList.add('open'); document.body.classList.add('con-panel');
            el.scrollTop = 0;
        }

        let PN_LISTA = [];
        function panelDia(f) {
            const l = [];
            alumnosPC().forEach(a => mesesDe(a).filter(x => x.vence === f).forEach(x => l.push({ a, x, e: estadoMes(a, x) })));
            l.sort((p1, p2) => ORDEN_EST.indexOf(p1.e) - ORDEN_EST.indexOf(p2.e) || comparar(p1.a.alumno, p2.a.alumno));
            PN_LISTA = l.map(x => x.a.id);
            const ok = l.filter(x => x.e === 'ok' || x.e === 'parcial').length;
            return `
                <div class="pn-top"><div class="grow"><div class="pn-nom">${cap(fLarga(f))}</div>
                    <div class="sub">${l.length ? `${l.length} alumno${l.length === 1 ? '' : 's'} · ${ok} pagado${ok === 1 ? '' : 's'}` : 'Nadie tiene fecha de pago este día'}</div></div>
                    <button class="pn-x" onclick="cerrarPanel()" title="Cerrar">✕</button></div>
                ${l.map((x, i) => `
                    <div class="pn-fila" onclick="abrirPanel(PN_LISTA[${i}], '${f}')">
                        <span class="dot" style="background:${EST[x.e].c}"></span>
                        <span class="fila-nom">${esc(x.a.alumno)}<br><span class="res-grupo">${esc(x.a.grupo)} · ${EST[x.e].txt}${x.x.fecha ? ' el ' + fDia(x.x.fecha) : ''}${marcaMsg(x.a.id)}</span></span>
                        <span class="fila-monto ${x.e === 'vencido' || x.e === 'hoy' ? 'rojo' : ''}">${dinero(x.a.pago.mensualidad)}</span>
                    </div>`).join('')}`;
        }

        function panelAlumno(a) {
            const p = a.pago, h = hoy(), debe = p.adeudo > 0;
            const rec = etapa(a);
            if (!PANEL.k || !plantillaDisponible(PANEL.k, a)) PANEL.k = rec || etapaBase(a) || PLANTILLAS.map(x => x.k).find(k => plantillaDisponible(k, a)) || 'preventivo';
            // Mensualidades: 6 meses atrás y 3 adelante
            const desde = sumarDias(h, -183).slice(0, 7), hasta = sumarDias(h, 95).slice(0, 7);
            const meses = mesesDe(a).filter(x => x.mes >= desde && x.mes <= hasta);
            const atraso = diasAtraso(a);
            const tel = a.telefono ? a.telefono.replace(/(\d{2})(\d{4})(\d{4})$/, '$1 $2 $3') : '';
            const num = waNumero(a.telefono);
            return `
                <div class="pn-top">
                    ${PANEL.dia ? `<button class="pn-volver" onclick="verDia('${PANEL.dia}')">‹ ${esc(cap(fLarga(PANEL.dia)))}</button>` : ''}
                    <div class="grow"></div>
                    <button class="pn-x" onclick="cerrarPanel()" title="Cerrar">✕</button>
                </div>
                <div class="pn-nom">${esc(a.alumno)}</div>
                <div class="sub">${esc(a.grupo)}${p.dia ? ` · Paga los días ${p.dia}` : ''}</div>

                <div style="margin-top:14px">${estadoPagoHtml(a, true).caja}</div>
                ${estadoPagoHtml(a, true).lineas}

                <button class="btn-main btn-verde btn-pn" style="margin-top:12px" onclick="abrirPago(PANEL.id)">➕ Registrar pago</button>

                <div class="pn-sec" id="pnMsg">Mensaje para ${esc(a.padre ? a.padre.split(' ')[0] : 'papá / mamá')}</div>
                <div class="plant">${PLANTILLAS.map(x => `<button class="${x.k === PANEL.k ? 'sel' : ''} ${x.k === rec ? 'rec' : ''}" ${plantillaDisponible(x.k, a) ? '' : 'disabled'} title="Para ${x.cuando}" onclick="elegirPlantilla('${x.k}')">${x.ico} ${x.nombre}</button>`).join('')}</div>
                <textarea id="msgTxt" class="msg-txt">${esc(textoPlantilla(PANEL.k, a))}</textarea>
                ${DATOS_PAGO.trim() ? '' : '<p class="ayuda" style="margin:4px 0 0;text-align:left">💡 Puedes agregar tus datos de pago (CLABE, banco) en <b>DATOS_PAGO</b> al inicio del código.</p>'}
                <button class="btn-main btn-wa btn-pn" style="margin-top:8px" ${num ? '' : 'disabled'} onclick="mandarPanel()">💬 Abrir WhatsApp</button>
                ${num ? '' : '<p class="ayuda" style="margin:6px 0 0">No hay teléfono en la hoja para este alumno.</p>'}

                <div class="pn-sec">Mensajes enviados</div>
                <div id="pnContactos">${listaContactos(a.id)}</div>

                <div class="pn-sec">Contacto</div>
                <div class="pago-linea"><span>Padre / Madre</span><b>${esc(a.padre || '—')}</b></div>
                <div class="pago-linea"><span>Teléfono</span><b>${esc(tel || '—')}</b></div>

                <div class="pn-sec">Datos de pago</div>
                <div class="pago-linea"><span>Mensualidad</span><b>${p.mensualidad ? dinero(p.mensualidad) : '—'}</b></div>
                ${['Inscripción', 'Material'].map(k => (p.cargos || {})[k] && (p.cargos[k].precio > 0 || p.cargos[k].estado !== 'no aplica')
                    ? `<div class="pago-linea"><span>${k}</span><b>${p.cargos[k].precio ? dinero(p.cargos[k].precio) : ''} ${p.cargos[k].estado === 'pagado' ? '<small style="color:#1e8449">✅</small>' : p.cargos[k].estado === 'pendiente' ? '<small class="rojo">pendiente</small>' : p.cargos[k].estado === 'parcial' ? `<small class="rojo">resta ${dinero(p.cargos[k].resta)}</small>` : ''}</b></div>` : '').join('')}
                ${p.sinDatos ? '<div class="aviso">Falta fecha de inicio o mensualidad en la hoja.</div>' : ''}
                ${p.ultimos.length ? `<div class="pn-sec">Últimos pagos</div>${p.ultimos.map(u => `<div class="pago-linea"><span>${fFecha(u.fecha)} · ${esc(u.concepto)}</span><b>${dinero(u.pagada)}${u.pagada < u.cobrada ? ` <small class="rojo">de ${dinero(u.cobrada)}</small>` : ''}</b></div>`).join('')}` : ''}`;
        }

        function elegirPlantilla(k) {
            const a = alumno(PANEL.id); if (!a) return;
            PANEL.k = k;
            document.querySelectorAll('.plant button').forEach(b => b.classList.toggle('sel', b.getAttribute('onclick') === `elegirPlantilla('${k}')`));
            $('msgTxt').value = textoPlantilla(k, a);
        }
        function mandarPanel() {
            const a = alumno(PANEL.id), num = waNumero(a && a.telefono);
            if (!num) return;
            abrirWhatsApp(num, $('msgTxt').value);
            registrarContacto(a.id, PANEL.k);
        }
        async function copiarPanel() {
            const t = $('msgTxt').value;
            try { await navigator.clipboard.writeText(t); toast('📋 Mensaje copiado'); }
            catch (e) { $('msgTxt').select(); document.execCommand('copy'); toast('📋 Mensaje copiado'); }
        }

        // =====================================================================
        //  SEGUIMIENTO DE COBRANZA: cada mensaje que abres en WhatsApp queda anotado
        //  en la pestaña "Seguimiento" de tu hoja (solo administrador).
        // =====================================================================
        function datosPago() { return DATOS_PAGO.trim() ? `\n\n${DATOS_PAGO.trim()}` : ''; }
        const PEND_SEG = {};    // mensajes anotados que todavía no confirma la hoja
        const contactosPendientes = () => Object.values(PEND_SEG);
        const ordenSeg = (x, y) => x.fecha < y.fecha ? -1 : x.fecha > y.fecha ? 1 : (x.fila || 1e9) - (y.fila || 1e9);
        const contactosDe = id => (DATA.seguimiento || []).filter(c => c.id === id).sort(ordenSeg);
        const ultimoContacto = id => contactosDe(id).pop() || null;
        function hace(f) {
            const d = difDias(hoy(), String(f).slice(0, 10));
            return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`;
        }
        const NOMBRE_CEL = { seguimiento: 'Recordatorio de adeudo', preventivo: 'Recordatorio', gracias: 'Confirmación de pago' };
        const icoK = k => (PLANTILLAS.find(x => x.k === k) || { ico: '💬' }).ico;
        const recienteMsg = id => { const u = ultimoContacto(id); return !!u && difDias(hoy(), u.fecha.slice(0, 10)) <= 7; };
        const marcaMsg = id => { const u = ultimoContacto(id); return u ? ` · 💬 ${hace(u.fecha)}` : ''; };
        function ultimoMsgHtml(id) {
            const u = ultimoContacto(id);
            return u ? `<div class="pago-linea"><span>💬 Último mensaje</span><b>${esc(u.tipo)} · ${hace(u.fecha)}</b></div>` : '';
        }
        function listaContactos(id) {
            const cs = contactosDe(id).reverse().slice(0, 6);
            if (!cs.length) return '<p class="ayuda" style="margin:0;text-align:left">Todavía no le has mandado mensajes desde la app.</p>';
            return cs.map(c => `<div class="pago-linea"><span>${icoK(c.k)} ${esc(c.tipo)}</span><b style="font-weight:600">${fFecha(c.fecha.slice(0, 10))}${c.fecha.length > 10 ? ' · ' + c.fecha.slice(11, 16) : ''}
                ${c.fila ? `<button class="pn-borrar" title="Borrar (no lo envié)" onclick="borrarContacto(${c.fila}, '${esc(c.id)}')">✕</button>` : '<small style="color:var(--text-light)"> guardando…</small>'}</b></div>`).join('');
        }
        // Refresca lo que muestra los mensajes sin redibujar toda la pantalla
        function refrescarMarcas() {
            if ($('modal').classList.contains('show')) return;
            const l = $('pnContactos');
            if (l && PANEL && PANEL.id) l.innerHTML = listaContactos(PANEL.id);
        }

        function registrarContacto(id, k) {
            const a = alumno(id);
            if (!a || !esAdmin() || !k) return;
            const tipo = (DESK || COLA ? (plantilla(k) || {}).nombre : '') || NOMBRE_CEL[k] || k;
            const tmp = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
            const ahora = new Date(); ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
            PEND_SEG[tmp] = { fila: 0, fecha: ahora.toISOString().slice(0, 16).replace('T', ' '), id, k, tipo, tmp };
            DATA.seguimiento = (DATA.seguimiento || []).concat(PEND_SEG[tmp]);
            if (!$('modal').classList.contains('show')) setTimeout(render, 400);   // muestra la marca 💬
            fetch(URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ pin: pin(), accion: 'registrarContacto', id, alumno: a.alumno, k, tipo, tmp }) })
                .then(r => r.json())
                .then(d => {
                    delete PEND_SEG[tmp];
                    if (!d.ok) throw new Error(d.error);
                    DATA.seguimiento = d.seguimiento.concat(contactosPendientes()); if (RAW) RAW.seguimiento = d.seguimiento;
                    lsSet('fichas_cache', JSON.stringify(DATA));
                    refrescarMarcas();
                })
                .catch(() => {
                    delete PEND_SEG[tmp];
                    DATA.seguimiento = DATA.seguimiento.filter(c => c.tmp !== tmp);
                    toast('⚠️ No se pudo anotar el mensaje en la hoja');
                    refrescarMarcas();
                });
        }

        async function borrarContacto(fila, id) {
            if (!confirm('¿Borrar este mensaje del registro?\n(Úsalo si al final no lo enviaste)')) return;
            cargando(true, true);
            try {
                const r = await fetch(URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ pin: pin(), accion: 'borrarContacto', fila, id }) });
                const d = await r.json();
                if (!d.ok) throw new Error(d.error);
                DATA.seguimiento = d.seguimiento.concat(contactosPendientes()); if (RAW) RAW.seguimiento = d.seguimiento;
                lsSet('fichas_cache', JSON.stringify(DATA));
                render();
            } catch (e) { alert(e instanceof TypeError ? '❌ Revisa tu conexión e intenta de nuevo.' : '❌ ' + e.message); }
            finally { cargando(false); }
        }

        // ---------- Envío en cola de los mensajes sugeridos ----------
        let COLA = null;   // { ids, i, k, txt, abierto, enviados }
        const listaCola = () => alumnosPC().filter(a => etapa(a) && waNumero(a.telefono))
            .sort((x, y) => (diasAtraso(y) ?? -1) - (diasAtraso(x) ?? -1) || comparar(x.alumno, y.alumno));
        function botonCola(chico) {
            const n = listaCola().length;
            if (!n) return chico ? '' : '<div class="cola-ok">✔️ No hay mensajes sugeridos pendientes por hoy.</div>';
            return chico ? `<button class="btn-mini btn-cola" onclick="iniciarCola()">📨 Mensajes sugeridos (${n})</button>`
                : `<button class="btn-main btn-wa cola-btn" onclick="iniciarCola()">📨 Enviar ${n} mensaje${n === 1 ? '' : 's'} sugerido${n === 1 ? '' : 's'}${CAL.grupo ? ' de ' + esc(CAL.grupo) : ''}</button>`;
        }
        function iniciarCola() {
            const ids = listaCola().map(a => a.id);
            if (!ids.length) return;
            COLA = { ids, i: 0, k: null, txt: null, abierto: false, enviados: 0 };
            pintarCola();
            $('modal').classList.add('show');
        }
        function pintarCola() {
            const id = COLA.ids[COLA.i];
            const a = id && alumno(id);
            if (!a) return finCola();
            if (!COLA.k) { COLA.k = etapa(a) || etapaBase(a) || 'preventivo'; COLA.txt = textoPlantilla(COLA.k, a); }
            const pl = plantilla(COLA.k), n = COLA.ids.length, atr = diasAtraso(a);
            $('modalIn').innerHTML = `
                <h2>📨 Mensajes sugeridos · ${COLA.i + 1} de ${n}</h2>
                <div class="cola-barra"><div style="width:${Math.round(COLA.i / n * 100)}%"></div></div>
                <div class="pn-nom" style="margin-top:14px">${esc(a.alumno)}</div>
                <div class="sub">${esc(a.grupo)} · ${a.pago.adeudo > 0 ? `Debe ${dinero(a.pago.adeudo)}${atr ? ` · ${atr} día${atr === 1 ? '' : 's'} de atraso` : ''}` : 'Al corriente'}${a.padre ? ' · Para ' + esc(a.padre.split(' ')[0]) : ''}</div>
                <div class="etapa-rec" style="margin-top:10px">${pl.ico} <b>${pl.nombre}</b> (${pl.cuando})</div>
                <textarea id="colaTxt" class="msg-txt" style="min-height:190px" oninput="COLA.txt = this.value">${esc(COLA.txt)}</textarea>
                ${COLA.abierto ? `
                    <button class="btn-main btn-verde" style="margin-top:10px" onclick="colaSiguiente()">${COLA.i + 1 < n ? 'Siguiente →' : 'Terminar ✓'}</button>
                    <p class="ayuda" style="margin:8px 0 0">✅ Anotado. <span class="link-pin" onclick="colaAbrir()">Volver a abrir el chat</span></p>`
                  : `<div class="btns2" style="margin-top:10px">
                        <button class="btn-main btn-wa" onclick="colaAbrir()">💬 Abrir WhatsApp</button>
                        <button class="btn-main btn-gris" onclick="colaSiguiente()">Saltar</button>
                    </div>`}
                <button class="btn-rojo-txt" style="color:var(--text-light)" onclick="terminarCola()">Salir de la cola</button>`;
        }
        function colaAbrir() {
            const a = alumno(COLA.ids[COLA.i]);
            abrirWhatsApp(waNumero(a.telefono), COLA.txt);
            if (!COLA.abierto) { registrarContacto(a.id, COLA.k); COLA.enviados++; COLA.abierto = true; }
            pintarCola();
        }
        function colaSiguiente() { COLA.i++; COLA.k = null; COLA.txt = null; COLA.abierto = false; pintarCola(); }
        function finCola() {
            const n = COLA.enviados;
            $('modalIn').innerHTML = `
                <div class="vacio" style="padding:20px 10px 10px"><div style="font-size:3rem">✅</div>
                <b style="font-size:1.2rem;color:var(--text)">¡Listo!</b><br>
                ${n ? `Enviaste ${n} mensaje${n === 1 ? '' : 's'}. Quedaron anotados en la pestaña <b>Seguimiento</b>.` : 'No enviaste mensajes.'}</div>
                <button class="btn-main btn-gris" onclick="terminarCola()">Cerrar</button>`;
        }
        function terminarCola() { COLA = null; cerrarModal(); render(); }
        function salirModal() { if (COLA) terminarCola(); else cerrarModal(); }

        // =====================================================================
        //  FINANZAS (versión computadora): resumen, gastos y pago a maestras
        // =====================================================================
        const fin = () => DATA.finanzas || { ingresos: [], gastos: [] };
        const mesMas = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad2(m)}`; };
        const nombreMes = ym => { const [y, m] = ym.split('-').map(Number); return `${cap(MESES[m - 1])} ${y}`; };
        const ingresosMes = (ym, concepto) => fin().ingresos.filter(x => x.mes === ym && (!concepto || x.concepto === concepto)).reduce((t, x) => t + x.monto, 0);
        const brutoMes = (ym, concepto) => fin().ingresos.filter(x => x.mes === ym && x.concepto === concepto).reduce((t, x) => t + (x.bruto ?? x.monto), 0);
        const ingresosHasta = (ym, dia) => fin().ingresos.filter(x => x.mes === ym && (!x.fecha || Number(x.fecha.slice(8)) <= dia)).reduce((t, x) => t + x.monto, 0);
        const gastosHasta = (ym, dia) => gastosDelMes(ym).filter(g => Number(g.fecha.slice(8)) <= dia).reduce((t, g) => t + g.monto, 0);
        const gastosDelMes = ym => fin().gastos.filter(g => g.fecha.slice(0, 7) === ym);
        const gastosMes = (ym, cat) => gastosDelMes(ym).filter(g => !cat || g.categoria === cat).reduce((t, g) => t + g.monto, 0);
        const milles = n => Math.abs(n) >= 1000 ? '$' + (Math.round(n / 100) / 10).toLocaleString('es-MX') + 'k' : dinero(n);
        const pct = (a, b) => b ? Math.round(a / b * 100) : null;
        // Compara contra el mes anterior; si el mes va en curso, contra los mismos días del mes anterior
        function cambio(actual, antes, txtAntes, alReves) {
            if (!antes) return `<span>${txtAntes}: ${dinero(antes)}</span>`;
            const d = Math.round((actual - antes) / antes * 100);
            const bueno = alReves ? d <= 0 : d >= 0;
            return `<span><strong style="color:${bueno ? '#1e8449' : '#b03a2e'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}%</strong> vs ${txtAntes} (${dinero(antes)})</span>`;
        }
        function selMes(estado, fn) {
            return `<div class="cal-nav">
                <button class="flecha" onclick="${estado} = mesMas(${estado}, -1); render()" title="Mes anterior">‹</button>
                <b>${nombreMes(fn)}</b>
                <button class="flecha" onclick="${estado} = mesMas(${estado}, 1); render()" title="Mes siguiente">›</button>
            </div>${fn !== hoy().slice(0, 7) ? `<button class="btn-mini" onclick="${estado} = hoy().slice(0, 7); render()">Mes actual</button>` : ''}`;
        }

        // ---------- Antigüedad de saldos (por monto de cada cargo pendiente) ----------
        // La fila "Más de 30 días" solo aparece si alguien llega a deber más de 30 días
        const TRAMOS = [
            { txt: '1 a 15 días', max: 15, c: '#f1948a' },
            { txt: '16 a 30 días', max: 30, c: '#e74c3c' },
            { txt: 'Más de 30 días', max: Infinity, c: '#922b21', soloSiHay: true }
        ];
        function antiguedad() {
            const h = hoy();
            const res = TRAMOS.map(t => Object.assign({}, t, { monto: 0, alumnos: [] }));
            DATA.alumnos.filter(a => a.pago && a.pago.adeudo > 0).forEach(a => {
                let peor = 0;
                a.pago.detalle.forEach(d => {
                    let vence;
                    if (d.concepto === 'Mensualidad' && !d.fila) { const m = mesesDe(a).find(x => x.mes === d.mes); vence = m ? m.vence : d.mes + '-01'; }
                    else if (!d.fila && a.pago.inicio) vence = a.pago.inicio;                 // inscripción / material nunca pagados
                    else vence = d.mes + '-' + pad2(Math.min(a.pago.dia || 1, 28));          // saldo de un pago parcial
                    const dias = Math.max(1, difDias(h, vence));
                    res[TRAMOS.findIndex(t => dias <= t.max)].monto += d.monto;
                    peor = Math.max(peor, dias);
                });
                res[TRAMOS.findIndex(t => peor <= t.max)].alumnos.push({ a, dias: peor });
            });
            res.forEach(r => r.alumnos.sort((x, y) => y.dias - x.dias));
            return res;
        }

        // ---------- VISTA: resumen ----------
        let RES_MES = '', RES_TRAMO = -1, RES_TABLA = false, GRAF = [], RES_RANGO = 1;
        // Datos de la gráfica: por mes (3, 6 o 12 meses) o, si es un solo mes, por semana del mes
        function datosGrafica(ym) {
            if (RES_RANGO > 1) return Array.from({ length: RES_RANGO }, (_, i) => {
                const m = mesMas(ym, i - RES_RANGO + 1), [yy, mm] = m.split('-').map(Number);
                return { etq: MES_CORTO[mm - 1] + (mm === 1 || i === 0 ? ' ' + String(yy).slice(2) : ''), tit: nombreMes(m), act: m === ym, ing: ingresosMes(m), gas: gastosMes(m) };
            });
            const [yy, mm] = ym.split('-').map(Number), nd = new Date(yy, mm, 0).getDate(), out = [];
            for (let d = 1; d <= nd; d += 7) {
                const h = Math.min(d + 6, nd), f1 = `${ym}-${pad2(d)}`, f2 = `${ym}-${pad2(h)}`;
                const enRango = f => f >= f1 && f <= f2;
                out.push({ etq: `${d}–${h} ${MES_CORTO[mm - 1]}`, tit: `Del ${d} al ${h} de ${MESES[mm - 1]}`, act: ym === hoy().slice(0, 7) && enRango(hoy()),
                    ing: fin().ingresos.filter(x => x.fecha && enRango(x.fecha)).reduce((t, x) => t + x.monto, 0),
                    gas: gastosDelMes(ym).filter(g => enRango(g.fecha)).reduce((t, g) => t + g.monto, 0) });
            }
            return out;
        }
        const RANGOS = [[1, 'Mes'], [3, '3 meses'], [6, '6 meses'], [12, '12 meses']];
        function vistaResumen() {
            if (!RES_MES) RES_MES = hoy().slice(0, 7);
            header('📊 Resumen', false, '');
            lleno();
            // Periodo según el filtro: el mes elegido o los últimos 3, 6 o 12 meses hasta ese mes
            const ym = RES_MES, n = RES_RANGO;
            const MS = Array.from({ length: n }, (_, i) => mesMas(ym, i - n + 1));
            const MA = MS.map(m => mesMas(m, -n));                           // periodo anterior, para comparar
            const suma = (ms, f) => ms.reduce((t, m) => t + f(m), 0);
            const ing = suma(MS, m => ingresosMes(m)), gas = suma(MS, m => gastosMes(m)), gan = ing - gas;
            // Si el mes va en curso, el último mes del periodo anterior se cuenta solo hasta el mismo día
            const enCurso = ym === hoy().slice(0, 7), diaHoy = Number(hoy().slice(8)), ultA = MA[MA.length - 1];
            const ingA = suma(MA.slice(0, -1), m => ingresosMes(m)) + (enCurso ? ingresosHasta(ultA, diaHoy) : ingresosMes(ultA));
            const gasA = suma(MA.slice(0, -1), m => gastosMes(m)) + (enCurso ? gastosHasta(ultA, diaHoy) : gastosMes(ultA));
            const txtAnt = n === 1 ? (enCurso ? `al ${diaHoy} de ${fMes(ultA)}` : fMes(ultA)) : `los ${n} meses anteriores`;
            const periodo = n === 1 ? (fMes(ym) || nombreMes(ym)) : `${MES_CORTO[Number(MS[0].slice(5)) - 1]} ${MS[0].slice(2, 4)} – ${MES_CORTO[Number(ym.slice(5)) - 1]} ${ym.slice(2, 4)}`;
            const maestrasMes = suma(MS, m => gastosMes(m, 'Maestras'));
            const adeudo = DATA.alumnos.reduce((t, a) => t + (a.pago && a.pago.adeudo > 0 ? a.pago.adeudo : 0), 0);
            const activos = DATA.alumnos.filter(a => a.pago);
            const pers = activos.flatMap(a => mesesDe(a).filter(x => MS.includes(x.mes) && (x.vence <= hoy() || x.mes >= hoy().slice(0, 7))));
            const pagadas = pers.filter(x => x.pagado).length;
            const esperado = activos.reduce((t, a) => t + (a.pago.mensualidad || 0), 0);
            const ingC = c => suma(MS, m => ingresosMes(m, c)), brutoC = c => suma(MS, m => brutoMes(m, c));
            const conAdeudo = DATA.alumnos.filter(a => a.pago && a.pago.adeudo > 0).length;
            // Fuentes de ingreso (renglones fijos) y en qué se va (maestras, otros gastos, ganancia)
            const fijos = ['Mensualidad', 'Inscripción', 'Material', 'Tienda', 'Actividades', 'Merch'];
            const fuentes = [
                { txt: 'Mensualidades', v: ingC('Mensualidad'), c: '#2a78d6' },
                { txt: 'Inscripciones', v: ingC('Inscripción'), c: '#eb6834' },
                { txt: 'Material <small>(ganancia)</small>', v: ingC('Material'), c: '#1baf7a', sub: `de ${dinero(brutoC('Material'))} cobrados` },
                { txt: 'Tienda <small>(ganancia)</small>', v: ingC('Tienda'), c: '#eda100', sub: `de ${dinero(brutoC('Tienda'))} vendidos` },
                { txt: 'Actividades', v: ingC('Actividades'), c: '#e34948' },
                { txt: 'Merch', v: ingC('Merch'), c: '#95a5a6' },
                { txt: 'Otros ingresos', v: Math.max(0, Math.round((ing - fijos.reduce((t, c) => t + ingC(c), 0)) * 100) / 100), c: '#95a5a6' }
            ];
            // En la dona, playeras y otros ingresos van juntos (gris); en Métricas, cada uno en su renglón
            const fuentesDona = fuentes.slice(0, 5).concat([{ txt: 'Merch y otros', v: fuentes[5].v + fuentes[6].v, c: '#95a5a6' }]);
            const usos = [
                { txt: 'Maestras', v: maestrasMes, c: '#4a3aa7' },
                { txt: 'Otros gastos', v: gas - maestrasMes, c: '#e87ba4', sub: gastosPorCat(MS) },
                { txt: 'Ganancia neta', v: Math.max(0, gan), c: '#008300' }
            ];
            GRAF = datosGrafica(ym); DONAS = [];
            const fila = (t, v, sub) => `<div class="pago-linea"><span>${t}</span><b>${v}${sub ? ` <small style="color:var(--text-light);font-weight:600">${sub}</small>` : ''}</b></div>`;
            main(`
                ${avisoScript()}
                <div class="pc-barra">${selMes('RES_MES', ym)}<div class="grow"></div>
                    <span class="sub" style="margin:0">Periodo:</span>
                    <div class="tabs">${RANGOS.map(([k, t]) => `<button class="tab ${RES_RANGO === k ? 'sel' : ''}" onclick="RES_RANGO = ${k}; render()">${k === 1 && ym === hoy().slice(0, 7) ? 'Mes actual' : k === 1 ? 'Solo ' + (fMes(ym) || nombreMes(ym)) : 'Últimos ' + t}</button>`).join('')}</div></div>
                <div class="kpis">
                    <div class="kpi"><span>Ingresos · ${periodo}</span><b>${dinero(ing)}</b>${cambio(ing, ingA, txtAnt)}</div>
                    <div class="kpi"><span>Gastos · ${periodo}</span><b>${dinero(gas)}</b>${maestrasMes ? `<span>Maestras: ${dinero(maestrasMes)}</span>` : cambio(gas, gasA, txtAnt, true)}</div>
                    <div class="kpi"><span>Ganancia · ${periodo}</span><b style="color:${gan < 0 ? '#c0392b' : '#1e8449'}">${dinero(gan)}</b><span>${ing ? `Margen: ${pct(gan, ing)}%` : 'Sin ingresos en el periodo'}</span></div>
                    <div class="kpi"><span>Por cobrar (hoy)</span><b style="color:${adeudo ? '#c0392b' : ''}">${dinero(adeudo)}</b><span>${conAdeudo} alumno${conAdeudo === 1 ? '' : 's'} con adeudo</span></div>
                </div>

                <div class="res-grid2">
                    <div class="res-card rg-graf">
                        <div class="res-tit"><b>Ingresos y gastos · ${RES_RANGO === 1 ? `${fMes(ym) || nombreMes(ym)} por semana` : `${RES_RANGO} meses hasta ${fMes(ym) || nombreMes(ym)}`}</b>
                            <span class="leyenda" style="margin:0"><span style="--c:#27ae60">Ingresos</span><span style="--c:#5b6ee1">Gastos</span></span>
                            <div class="grow"></div>
                            <button class="btn-mini" onclick="RES_TABLA = !RES_TABLA; render()">${RES_TABLA ? '📊 Ver gráfica' : '📋 Ver tabla'}</button></div>
                        ${RES_TABLA ? `<div class="graf-tabla">${tablaMeses()}</div>` : '<div id="grafica" class="grafica"></div><div id="tip" class="tip"></div>'}
                    </div>

                    <div class="res-card rg-dona">
                        <div class="res-tit"><b>¿De dónde viene y a dónde va el dinero? · ${periodo}</b></div>
                        <div class="donas">
                            ${dona('¿De dónde viene?', fuentesDona, ing, 'Ingresos', milles(ing))}
                            ${dona('¿A dónde va?', usos, Math.max(ing, gas), gan >= 0 ? 'Ganancia neta' : 'Pérdida', ing ? (gan >= 0 ? pct(gan, ing) + '%' : milles(-gan)) : '—')}
                        </div>
                        <div id="tipDona" class="tip"></div>
                    </div>

                    <div class="res-card rg-met">
                        <div class="res-tit"><b>Métricas · ${periodo}</b></div>
                        <div class="met">
                            ${fila('Alumnos activos', activos.length)}
                            ${fila('Mensualidades pagadas', `${pagadas} de ${pers.length}`, pers.length ? `(${pct(pagadas, pers.length)}%)` : '')}
                            ${fila('Ingreso mensual esperado', dinero(esperado), 'si todos pagan')}
                            <div class="pago-sub">Ingresos <span>% del total</span></div>
                            ${fuentes.map(f => fila(`<span class="met-dot" style="background:${f.c}"></span>${f.txt}`, dinero(f.v), `${pctTxt(f.v, ing)}`)).join('')}
                            ${fila('<b>Total de ingresos</b>', dinero(ing), ing ? '100%' : '—')}
                            <div class="pago-sub">Gastos y ganancia <span>% de los ingresos</span></div>
                            ${usos.slice(0, 2).map(f => fila(`<span class="met-dot" style="background:${f.c}"></span>${f.txt}`, dinero(f.v), pctTxt(f.v, ing))).join('')}
                            ${fila('<b>Total de gastos</b>', dinero(gas), pctTxt(gas, ing))}
                            <div class="pago-linea met-total"><span><span class="met-dot" style="background:#008300"></span><b>${gan >= 0 ? 'Ganancia neta' : 'Pérdida'}</b></span><b style="color:${gan < 0 ? '#c0392b' : '#1e8449'}">${dinero(gan)} <small style="font-weight:600">${ing ? pctTxt(gan, ing) : '—'}</small></b></div>
                        </div>
                    </div>
                </div>`);
        }

        const pctTxt = (v, t) => t ? (Math.round(v / t * 1000) / 10).toLocaleString('es-MX') + '%' : '—';
        function gastosPorCat(MS) {
            const g = {};
            fin().gastos.filter(x => MS.includes(x.fecha.slice(0, 7)) && x.categoria !== 'Maestras').forEach(x => g[x.categoria] = (g[x.categoria] || 0) + x.monto);
            return Object.keys(g).sort((a, b) => g[b] - g[a]).map(k => `${k}: ${dinero(g[k])}`).join('<br>');
        }

        // ---------- Estado de pago completo: lo vencido + la mensualidad del mes que todavía no vence ----------
        // (la mensualidad que aún no vence no es adeudo todavía, pero se muestra junto con lo que debe)
        function porVencerMes(a) {
            const p = a.pago;
            if (!p || !p.mesPendiente || !p.venceMes || p.venceMes <= hoy()) return null;
            return { concepto: 'Mensualidad', mes: hoy().slice(0, 7), monto: p.mensualidad, vence: p.venceMes };
        }
        function estadoPagoHtml(a, conAtraso) {
            const p = a.pago, debe = p.adeudo > 0, pv = porVencerMes(a), mesTxt = fMes(hoy().slice(0, 7));
            const total = p.adeudo + (pv ? pv.monto : 0);
            const atraso = conAtraso && debe ? diasAtraso(a) : null;
            // Recuadro de tamaño fijo: el total (vencido + por vencer) y una línea corta; abajo, el desglose
            const titulo = total > 0 ? `${debe ? 'Debe' : 'Por pagar'} ${dinero(total)}` : `✅ ${mesTxt ? cap(mesTxt) + ' pagado' : 'Al corriente'}`;
            const sub = debe ? (atraso ? `${atraso} día${atraso === 1 ? '' : 's'} de atraso` : 'Tiene pagos vencidos')
                : pv ? `Vence el ${fDia(pv.vence)}` : (p.proximo ? 'Próximo pago: ' + fDia(p.proximo) : '');
            const lineas = p.detalle.map(d => `<div class="pago-linea"><span>${esc(etiquetaCargo(d))}${d.parcial ? ' (resta)' : ''}</span><b class="rojo">${dinero(d.monto)}</b></div>`).join('')
                + (pv ? `<div class="pago-linea"><span>Mensualidad ${mesTxt} – ${fDia(pv.vence)}</span><b style="color:#b9770e">${dinero(pv.monto)}</b></div>` : '');
            return { caja: `<div class="pago-estado fijo ${total > 0 ? 'pago-debe' : 'pago-ok'}"><b>${titulo}</b><span>${sub}</span></div>`, lineas: total > 0 ? lineas : '' };
        }
        // Texto para mensajes: cada cargo (incluida la mensualidad por vencer) y el total
        function textoPendientes(a) {
            const p = a.pago, pv = porVencerMes(a);
            const lineas = p.detalle.map(d => `• ${etiquetaCargo(d)}: ${dinero(d.monto)}`)
                .concat(pv ? [`• Mensualidad ${fMes(pv.mes)} – ${fDia(pv.vence)}: ${dinero(pv.monto)}`] : []).join('\n');
            return { lineas, total: p.adeudo + (pv ? pv.monto : 0), pv };
        }
        // Gráfica de dona (SVG) con leyenda; cada rebanada muestra su detalle al pasar el mouse
        let DONAS = [];
        function dona(titulo, partes, total, centro1, centro2) {
            const id = DONAS.length, R = 84, r = 56, C = 96;
            DONAS.push({ partes, total });
            const vivas = partes.filter(p => p.v > 0), suma2 = vivas.reduce((t, p) => t + p.v, 0);
            let a0 = -Math.PI / 2, svg = '';
            if (!suma2) svg = `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="#eef0f2" stroke-width="${R - r}"/>`;
            else if (vivas.length === 1) { const k = partes.indexOf(vivas[0]); svg = `<circle class="dona-seg" data-d="${id}" data-k="${k}" cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="${vivas[0].c}" stroke-width="${R - r}"/>`; }
            else vivas.forEach(p => {
                const ang = p.v / suma2 * Math.PI * 2, a1 = a0 + ang, gap = Math.min(0.02, ang / 4);
                const pt = (rad, a) => `${C + rad * Math.cos(a)},${C + rad * Math.sin(a)}`, big = ang - 2 * gap > Math.PI ? 1 : 0;
                svg += `<path class="dona-seg" data-d="${id}" data-k="${partes.indexOf(p)}" fill="${p.c}" d="M${pt(R, a0 + gap)} A${R},${R} 0 ${big} 1 ${pt(R, a1 - gap)} L${pt(r, a1 - gap)} A${r},${r} 0 ${big} 0 ${pt(r, a0 + gap)} Z"/>`;
                a0 = a1;
            });
            return `<div class="dona">
                <div class="dona-tit">${titulo}</div>
                <div class="dona-cuerpo">
                    <div class="dona-svg"><svg viewBox="0 0 ${2 * C} ${2 * C}" role="img" aria-label="${titulo}">${svg}</svg>
                        <div class="dona-centro"><small>${centro1}</small><b>${centro2}</b></div></div>
                    <div class="dona-ley">${partes.map((p, k) => `<div class="dona-fila" data-d="${id}" data-k="${k}"><span class="met-dot" style="background:${p.c}"></span><span class="grow">${p.txt}</span><b>${pctTxt(p.v, suma2)}</b></div>`).join('')}</div>
                </div></div>`;
        }
        function activarDonas() {
            const tip = $('tipDona'); if (!tip) return;
            const card = tip.parentNode;
            document.querySelectorAll('.dona-seg, .dona-fila').forEach(el => {
                el.addEventListener('mousemove', e => {
                    const d = DONAS[el.dataset.d], p = d.partes[el.dataset.k], tot = d.partes.filter(x => x.v > 0).reduce((t, x) => t + x.v, 0);
                    tip.innerHTML = `<b>${p.txt}</b><div>${dinero(p.v)} <b>${pctTxt(p.v, tot)}</b></div>${p.sub ? `<div class="t-sub" style="display:block">${p.sub}</div>` : ''}`;
                    const rc = card.getBoundingClientRect();
                    tip.style.display = 'block';
                    tip.style.left = Math.max(4, Math.min(e.clientX - rc.left - tip.offsetWidth / 2, rc.width - tip.offsetWidth - 4)) + 'px';
                    tip.style.top = (e.clientY - rc.top - tip.offsetHeight - 14) + 'px';
                    document.querySelectorAll(`[data-d="${el.dataset.d}"]`).forEach(x => x.classList.toggle('apagado', x.dataset.k !== el.dataset.k));
                });
                el.addEventListener('mouseleave', () => { tip.style.display = 'none'; document.querySelectorAll('.apagado').forEach(x => x.classList.remove('apagado')); });
            });
        }

        function tablaMeses() {
            return `<table class="tabla" style="box-shadow:none"><thead><tr><th>${RES_RANGO === 1 ? 'Semana' : 'Mes'}</th><th class="num">Ingresos</th><th class="num">Gastos</th><th class="num">Ganancia</th><th class="num">Margen</th></tr></thead>
                <tbody>${GRAF.slice().reverse().map(g => `<tr style="cursor:default"><td>${g.tit}</td><td class="num">${dinero(g.ing)}</td><td class="num">${dinero(g.gas)}</td>
                    <td class="num"><b style="color:${g.ing - g.gas < 0 ? '#c0392b' : ''}">${dinero(g.ing - g.gas)}</b></td><td class="num">${g.ing ? pct(g.ing - g.gas, g.ing) + '%' : '—'}</td></tr>`).join('')}

                    <td class="num"><b>${dinero(GRAF.reduce((t, g) => t + g.ing - g.gas, 0))}</b></td><td></td></tr></tbody></table>`;
        }

        // Gráfica de barras agrupadas (SVG): ingresos vs gastos por mes, con tooltip
        function pintarGrafica() {
            const box = $('grafica'); if (!box) return;
            const W = Math.max(320, box.clientWidth), H = 230, L = 48, B = 26, T = 10;
            // Eje fijo de $0 a $100,000 en todas las vistas (si algo pasa de $100k, la barra llega al tope)
            const tope = 100000, paso = 20000;
            const y = v => T + (H - T - B) * (1 - Math.min(v, tope) / tope);
            const gw = (W - L) / GRAF.length, bw = Math.min(RES_RANGO <= 3 ? 48 : 26, (gw - 14) / 2);
            const barra = (x, v, c) => { if (!v) return ''; const y0 = y(0), y1 = y(v), r = Math.min(4, (y0 - y1) / 2);
                return `<path d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z" fill="${c}"/>`; };
            let svg = '';
            for (let v = 0; v <= tope; v += paso) svg += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? '#eef0f2' : '#cfd6db'}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" class="g-eje">${milles(v)}</text>`;
            GRAF.forEach((g, i) => {
                const x0 = L + i * gw + (gw - 2 * bw - 2) / 2;
                svg += `<rect class="g-hit" x="${L + i * gw}" y="${T}" width="${gw}" height="${H - T}" data-i="${i}"/>`;
                svg += barra(x0, g.ing, '#27ae60') + barra(x0 + bw + 2, g.gas, '#5b6ee1');
                svg += `<text x="${L + i * gw + gw / 2}" y="${H - 8}" text-anchor="middle" class="g-eje ${g.act ? 'g-act' : ''}">${g.etq}</text>`;
            });
            box.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Gráfica de ingresos y gastos">${svg}</svg>`;
            const tip = $('tip');
            box.querySelectorAll('.g-hit').forEach(r => {
                r.addEventListener('mousemove', e => {
                    const g = GRAF[r.dataset.i], gan = g.ing - g.gas;
                    tip.innerHTML = `<b>${g.tit}</b><div><span class="tip-c" style="background:#27ae60"></span>Ingresos <b>${dinero(g.ing)}</b></div>
                        <div><span class="tip-c" style="background:#5b6ee1"></span>Gastos <b>${dinero(g.gas)}</b></div><div class="tip-g">Ganancia <b>${dinero(gan)}</b></div>`;
                    const rc = box.getBoundingClientRect();
                    tip.style.display = 'block';
                    tip.style.left = Math.min(e.clientX - rc.left + 14, rc.width - 190) + 'px';
                    tip.style.top = (e.clientY - rc.top + 10) + 'px';
                    box.querySelectorAll('.g-hit').forEach(x => x.classList.toggle('on', x === r));
                });
                r.addEventListener('mouseleave', () => { tip.style.display = 'none'; r.classList.remove('on'); });
            });
        }
        let _rs = 0;

        // ---------- VISTA: gastos ----------

        const CATEGORIAS_GASTO = ['Servicios', 'Material', 'Libros', 'Publicidad', 'Mobiliario', 'Limpieza y mantenimiento', 'Otros'];

            main(`

                        <div class="res-card tabla-caja" style="padding:0">
                            ${GAS_LISTA.length ? `<table class="tabla" style="box-shadow:none;border-radius:0">
                                <thead><tr><th>Fecha</th><th>Categoría</th><th>Concepto</th><th class="num">Monto</th><th></th></tr></thead>
                                <tbody>${GAS_LISTA.map((g, i) => `<tr class="${e && e.fila === g.fila ? 'act' : ''}" style="cursor:default">
                                    <td style="white-space:nowrap">${fFecha(g.fecha)}</td><td>${esc(g.categoria)}</td>
                                    <td>${esc(g.concepto)}${g.maestra ? `<span class="t-sub">${esc(g.maestra)}</span>` : ''}${g.actividad && actividad(g.actividad) ? `<span class="t-sub">🎉 ${esc(actividad(g.actividad).nombre)}</span>` : ''}</td>

        function editarGasto(i) { GAS_EDIT = Object.assign({}, GAS_LISTA[i]); render(); setTimeout(() => $('gMonto') && $('gMonto').focus(), 50); }

        // ---------- VISTA: vacaciones ----------
        // Un mes no se cobra si las vacaciones ocupan la mitad o más de sus días (se puede cambiar con las casillas)
        const diasMes = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
        function mesesTocados(ini, fin2) {
            if (!ini || !fin2 || fin2 < ini) return [];
            const out = [];
            for (let m = ini.slice(0, 7), k = 0; m <= fin2.slice(0, 7) && k < 24; m = mesMas(m, 1), k++) {
                const a = ini > `${m}-01` ? ini : `${m}-01`, b = fin2 < `${m}-${pad2(diasMes(m))}` ? fin2 : `${m}-${pad2(diasMes(m))}`;
                const dias = difDias(b, a) + 1;
                out.push({ mes: m, dias, total: diasMes(m), def: dias * 2 >= diasMes(m) });
            }
            return out;
        }
        const enVacaciones = f => (DATA.vacaciones || []).find(v => f >= v.inicio && f <= v.fin) || null;
        const fCorta = f => { const d = new Date(f + 'T12:00:00'); return `${d.getDate()} ${MES_CORTO[d.getMonth()]} ${d.getFullYear()}`; };

        let VAC = null;   // formulario: { fila, nombre, inicio, fin, meses: {mes: bool} }

                    </div>

                        <div class="res-tit"><b>¿Cómo funciona?</b></div>
                        <p class="vac-txt">📅 Los meses que marques como <b>sin cobro</b> no generan mensualidad para nadie.</p>

                        <p class="vac-txt">💡 La app sugiere no cobrar los meses en los que las vacaciones ocupan la mitad o más del mes. Tú decides con las casillas.</p>

                    </div>
                </div>

                ${lista.length ? `<div class="res-card" style="padding:0;overflow:hidden"><table class="tabla" style="box-shadow:none;border-radius:0">
                    <thead><tr><th>Nombre</th><th>Fechas</th><th>Regreso a clases</th><th>Meses sin cobro</th><th></th></tr></thead>
                    <tbody>${lista.map(v => `<tr style="cursor:default">
                        <td><b>${esc(v.nombre)}</b>${v.fin < h ? '<span class="t-sub">Ya pasaron</span>' : v.inicio <= h ? '<span class="t-sub" style="color:#1e8449">🏖️ En curso</span>' : '<span class="t-sub">Próximas</span>'}</td>
                        <td style="white-space:nowrap">${fCorta(v.inicio)} – ${fCorta(v.fin)}</td>

            pintarMesesVac();

        function pintarMesesVac() {

        // ---------- Gastos automáticos ----------

        async function guardarFijo() {

            if (!d.concepto) return alert('Escribe el concepto.');

        }

        // ---------- Pago a maestras (por horas, cada semana) ----------
        // Horas de una clase a partir del horario: "Lun y Mié 4:30pm - 6:00pm" → 1.5
        function duracionHorario(h) {
            const m = String(h || '').toLowerCase().replace(/\./g, '').match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:-|–|a)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
            if (!m) return null;
            const min = (hh, mm, ap) => { let x = Number(hh) % 12; if (ap === 'pm') x += 12; else if (!ap && Number(hh) === 12) x = 12; return x * 60 + Number(mm || 0); };
            const ap2 = m[6] || '';
            const fin2 = min(m[4], m[5], ap2);
            let ini = min(m[1], m[2], m[3] || ap2);                      // "4:30 - 6:00pm": la primera también es pm
            if (!m[3] && ini >= fin2) ini = min(m[1], m[2], 'am');       // "11:00 - 1:00pm"
            let finR = fin2;
            if (!m[3] && !m[6] && finR <= ini) finR += 12 * 60;          // "2:45 - 4:15" sin am/pm
            const horas = (finR - ini) / 60;
            return horas > 0 && horas <= 6 ? Math.round(horas * 100) / 100 : null;
        }
        function maestraDe(g) {
            const c = grupoCfg(g);
            if (c && c.maestra) return c.maestra;
            const n = sinAcentos(g);
            const m = (DATA.maestras || []).find(x => n.includes(sinAcentos(x.nombre)));
            return m ? m.nombre : '';
        }
        const lunesDe = f => { const d = new Date(f + 'T12:00:00'); return sumarDias(f, -((d.getDay() + 6) % 7)); };
        const rangoSemana = l => { const f = sumarDias(l, 6); const [a, b] = [new Date(l + 'T12:00:00'), new Date(f + 'T12:00:00')];
            return a.getMonth() === b.getMonth() ? `${a.getDate()} al ${b.getDate()} de ${MESES[b.getMonth()]}` : `${a.getDate()} de ${MESES[a.getMonth()]} al ${b.getDate()} de ${MESES[b.getMonth()]}`; };
        const fmtHoras = h => (Math.round(h * 100) / 100).toLocaleString('es-MX') + ' h';

        // Clases registradas en la semana: una por grupo y día (en grupos individuales, una por alumno)
        function clasesSemana(lunes) {
            const fin2 = sumarDias(lunes, 6), vistos = {}, out = [];
            DATA.registros.filter(r => r.fecha >= lunes && r.fecha <= fin2).forEach(r => {
                const ind = esIndividual(r.grupo), key = r.fecha + '|' + r.grupo + (ind ? '|' + r.id : '');
                if (vistos[key]) return; vistos[key] = 1;
                const cfg = grupoCfg(r.grupo), al = alumno(r.id);
                const hor = ind ? ((al && al.horario) || '') : ((cfg && cfg.horario) || (al && al.horario) || '');
                const dur = duracionHorario(hor);
                out.push({ fecha: r.fecha, grupo: r.grupo, alumno: ind ? r.alumno : '', horas: dur == null ? 1 : dur, estimado: dur == null, maestra: maestraDe(r.grupo) });
            });
            return out.sort((x, y) => x.fecha < y.fecha ? -1 : x.fecha > y.fecha ? 1 : comparar(x.grupo, y.grupo));
        }
        const pagoDe = (nombre, lunes) => fin().gastos.find(g => g.categoria === 'Maestras' && g.maestra === nombre && g.semana === lunes);

        let SEM = '', MAE = [], MAE_PAGOS = [];
        function vistaMaestras() {
            if (!SEM) SEM = lunesDe(hoy());
            header('👩‍🏫 Maestras', false, `<button class="btn-mini" onclick="formMaestra()">➕ Agregar maestra</button>`);
            $('main').classList.add('ancho');
            const clases = clasesSemana(SEM);
            const maestras = (DATA.maestras || []).filter(m => m.activa || clases.some(c => c.maestra === m.nombre) || pagoDe(m.nombre, SEM));
            MAE = maestras.map(m => { const cl = clases.filter(c => c.maestra === m.nombre); return { m, cl, horas: cl.reduce((t, c) => t + c.horas, 0), pago: pagoDe(m.nombre, SEM) }; });
            const sinMaestra = [...new Set(clases.filter(c => !c.maestra).map(c => c.grupo))];
            const totalSemana = MAE.reduce((t, x) => t + (x.pago ? x.pago.monto : x.horas * (x.m.tarifa || 0)), 0);
            // historial: últimas 8 semanas
            const semanas = Array.from({ length: 8 }, (_, i) => sumarDias(SEM, -7 * i));
            const nombresH = [...new Set(fin().gastos.filter(g => g.categoria === 'Maestras' && semanas.includes(g.semana)).map(g => g.maestra))].sort(comparar);
            MAE_PAGOS = fin().gastos.filter(g => g.categoria === 'Maestras');
            main(`
                <div class="pc-barra">
                    <div class="cal-nav">
                        <button class="flecha" onclick="SEM = sumarDias(SEM, -7); render()" title="Semana anterior">‹</button>
                        <b style="min-width:260px">Semana del ${rangoSemana(SEM)}</b>
                        <button class="flecha" onclick="SEM = sumarDias(SEM, 7); render()" title="Semana siguiente">›</button>
                    </div>
                    ${SEM !== lunesDe(hoy()) ? `<button class="btn-mini" onclick="SEM = lunesDe(hoy()); render()">Esta semana</button>` : ''}
                    <div class="grow"></div><b style="font-size:1.05rem">Total de la semana: ${dinero(totalSemana)}</b>
                </div>
                ${sinMaestra.length ? `<div class="aviso" style="margin:0 0 14px;text-align:left">⚠️ Hay clases de grupos sin maestra asignada: ${sinMaestra.map(g => `<span class="link-pin" data-g="${esc(g)}" onclick="ir('#/grupo/' + encodeURIComponent(this.dataset.g))">${esc(g)}</span>`).join(', ')}. Asígnala en ⚙️ del grupo para que cuenten sus horas.</div>` : ''}
                ${!MAE.length ? `<div class="vacio">Todavía no tienes maestras registradas.<br><br><button class="btn-main btn-verde" style="max-width:280px" onclick="formMaestra()">➕ Agregar maestra</button></div>` : ''}
                <div class="mae-grid">${MAE.map((x, i) => `
                    <div class="res-card">
                        <div class="res-tit"><b style="font-size:1.1rem">${esc(x.m.nombre)}</b>${x.m.activa ? '' : '<span class="chip">Inactiva</span>'}<div class="grow"></div>
                            <span class="sub" style="margin:0">${x.m.tarifa ? dinero(x.m.tarifa) + ' por hora' : '<span class="rojo">Sin pago por hora</span>'}</span>
                            <button class="pn-x" title="Editar" onclick="formMaestra(${i})">✏️</button></div>
                        ${x.cl.length ? x.cl.map(c => `<div class="pago-linea"><span>${fFecha(c.fecha)} · ${esc(c.grupo)}${c.alumno ? ' · ' + esc(c.alumno.split(' ')[0]) : ''}</span><b>${fmtHoras(c.horas)}${c.estimado ? ' <small title="No pude leer el horario; se cuenta 1 hora" style="color:#b9770e">estimado</small>' : ''}</b></div>`).join('')
                          : '<p class="ayuda" style="text-align:left;margin:4px 0 10px">No hay clases registradas de sus grupos esta semana.</p>'}
                        ${x.pago ? `
                            <div class="pago-estado pago-ok" style="margin:12px 0 0"><b>✅ Pagado ${dinero(x.pago.monto)}</b>
                                <span>${x.pago.horas !== '' ? fmtHoras(x.pago.horas) + ' · ' : ''}el ${fDia(x.pago.fecha)} · <span class="link-pin" onclick="deshacerPagoMaestra(${i})">Deshacer</span></span></div>`
                          : `<div class="mae-pago">
                                <div class="campo"><label>Horas a pagar</label><input id="mh${i}" inputmode="decimal" value="${Math.round(x.horas * 100) / 100}" oninput="$('mm${i}').value = Math.round((aNum(this.value) || 0) * ${x.m.tarifa || 0} * 100) / 100"></div>
                                <div class="campo"><label>Monto</label><input id="mm${i}" inputmode="decimal" value="${Math.round(x.horas * (x.m.tarifa || 0) * 100) / 100}"></div>
                                <button class="btn-main btn-verde" onclick="pagarMaestra(${i})">💵 Registrar pago</button>
                            </div>
                            <p class="ayuda" style="text-align:left;margin:0">Calculado con las clases que se registraron. Puedes ajustar las horas si dio clases extra o si faltó registrar alguna.</p>`}
                    </div>`).join('')}</div>
                ${nombresH.length ? `<div class="res-card" style="margin-top:14px;padding:0;overflow:hidden">
                    <div class="res-tit" style="padding:14px 16px 0"><b>Pagos de las últimas 8 semanas</b></div>
                    <table class="tabla" style="box-shadow:none;border-radius:0"><thead><tr><th>Semana</th>${nombresH.map(n => `<th class="num">${esc(n)}</th>`).join('')}<th class="num">Total</th></tr></thead>
                    <tbody>${semanas.map(s2 => { const ps = nombresH.map(n => pagoDe(n, s2)); const t = ps.reduce((a, p) => a + (p ? p.monto : 0), 0);
                        return `<tr style="cursor:pointer" onclick="SEM = '${s2}'; render()"><td>${rangoSemana(s2)}</td>${ps.map(p => `<td class="num">${p ? `${dinero(p.monto)}<span class="t-sub">${p.horas !== '' ? fmtHoras(p.horas) : ''}</span>` : '—'}</td>`).join('')}<td class="num"><b>${t ? dinero(t) : '—'}</b></td></tr>`; }).join('')}</tbody></table></div>` : ''}`);
        }

        async function pagarMaestra(i) {
            const x = MAE[i], horas = aNum($('mh' + i).value), monto = aNum($('mm' + i).value);
            if (horas == null || horas < 0) return alert('Revisa las horas.');
            if (!monto || monto <= 0) return alert(x.m.tarifa ? 'Revisa el monto.' : 'Escribe el monto, o agrega su pago por hora con ✏️.');
            if (!confirm(`¿Registrar pago a ${x.m.nombre}?\n\n${fmtHoras(horas)} · ${dinero(monto)}\nSemana del ${rangoSemana(SEM)}`)) return;
            const gasto = { fecha: hoy(), categoria: 'Maestras', concepto: `Semana del ${rangoSemana(SEM)} · ${fmtHoras(horas)}`, monto, maestra: x.m.nombre, horas, semana: SEM };
            if (!(await enviar({ accion: 'guardarGasto', gasto }))) return;
            toast('✅ Pago registrado'); render();
        }
        async function deshacerPagoMaestra(i) {
            const p = MAE[i].pago;
            if (!confirm(`¿Deshacer el pago de ${dinero(p.monto)} a ${MAE[i].m.nombre}?\nSe borra de Gastos.`)) return;
            if (!(await enviar({ accion: 'borrarGasto', fila: p.fila, monto: p.monto }))) return;
            toast('Pago borrado'); render();
        }

        let MAE_EDIT = null;
        function formMaestra(i) {
            const m = i != null ? MAE[i].m : null;
            MAE_EDIT = m ? m.nombre : '';
            $('modalIn').innerHTML = `
                <h2>${m ? '✏️ Editar maestra' : '➕ Agregar maestra'}</h2>
                <div class="campo"><label>Nombre</label><input id="maNombre" type="text" value="${esc(m ? m.nombre : '')}" placeholder="Ej. Miss Caro"></div>
                <div class="campo"><label>Pago por hora</label><input id="maTarifa" inputmode="decimal" value="${m && m.tarifa ? m.tarifa : ''}" placeholder="$0"></div>
                ${m ? `<label class="check"><input type="checkbox" id="maActiva" ${m.activa ? 'checked' : ''}> <span>Activa (desmárcala si ya no trabaja contigo; su historial se conserva)</span></label>` : ''}
                <p class="ayuda" style="text-align:left">Para que se cuenten sus horas, asígnale sus grupos en ⚙️ de cada grupo. Si su nombre aparece en el nombre del grupo (ej. "Kids 5pm Miss Caro"), se asigna sola.</p>
                <button class="btn-main btn-verde" onclick="guardarMaestraForm()">💾 Guardar</button>
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>
                ${m ? '<button class="btn-rojo-txt" onclick="quitarMaestra()">🗑️ Quitar de la lista de maestras</button>' : ''}`;
            $('modal').classList.add('show');
            setTimeout(() => $('maNombre').focus(), 50);
        }
        function quitarMaestra() {
            const n = MAE_EDIT;
            const grupos = [...new Set((DATA.grupos || []).filter(g => maestraDe(g.nombre) === n).map(g => g.nombre))];
            $('modalIn').innerHTML = `
                <h2>Quitar a ${esc(n)}</h2>
                <p class="ayuda" style="text-align:left">Ya no aparecerá en Maestras. Los pagos que ya le hiciste se quedan en Gastos.</p>
                ${grupos.length ? `<p class="ayuda" style="text-align:left;margin-bottom:6px">Tiene ${grupos.length} grupo${grupos.length === 1 ? '' : 's'}: <b>${grupos.map(esc).join(', ')}</b>. ¿Qué pasa con ellos?</p>
                    <button class="btn-main btn-verde" onclick="confirmarQuitarMaestra(true)">Los da alguien a quien no le pago (ej. la dueña)</button>
                    <p class="ayuda" style="margin:4px 0 10px">Sus clases ya no cuentan para pagos ni salen como pendientes.</p>
                    <button class="btn-main btn-gris" onclick="confirmarQuitarMaestra(false)">Quedan sin maestra (asignaré otra)</button>`
                  : `<button class="btn-main btn-verde" onclick="confirmarQuitarMaestra(false)">Quitar</button>`}
                <button class="btn-main btn-gris" onclick="cerrarModal()">Cancelar</button>`;
        }
        async function confirmarQuitarMaestra(sinPago) {
            if (!(await enviar({ accion: 'borrarMaestra', nombre: MAE_EDIT, sinPago }))) return;
            toast(`${MAE_EDIT} ya no está en Maestras`); render();
        }
        async function guardarMaestraForm() {
            const nombre = $('maNombre').value.trim(), tarifa = aNum($('maTarifa').value);
            if (!nombre) return alert('Escribe el nombre.');
            if (tarifa != null && tarifa < 0) return alert('Revisa el pago por hora.');
            const activa = $('maActiva') ? $('maActiva').checked : true;
            if (!(await enviar({ accion: 'guardarMaestra', anterior: MAE_EDIT, nombre, tarifa: tarifa || '', activa }))) return;
            toast('✅ Maestra guardada'); render();
        }

        window.addEventListener('resize', () => {
            if (CARGADO && modoPC() !== DESK) return render();
            if (DESK && document.querySelector('.cal') && ajustarCalendario()) vistaCalendario();
        });
        document.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            if ($('modal').classList.contains('show')) salirModal();
            else if (PANEL) cerrarPanel();
        });

        // =====================================================================
        //  TIENDITA: vender (maestras y administrador) e inventario (administrador, computadora)
        // =====================================================================
        const tiendaOk = () => !!(DATA.tienda && DATA.tienda.productos);
        const producto = sku => tiendaOk() ? DATA.tienda.productos.find(p => p.sku === sku) : null;
        // Ganancia de la tienda por día (para el Resumen): venta − costo; el consumo personal cuenta como costo
        function ingresosTienda() {
            if (!tiendaOk() || !DATA.tienda.ventas) return [];
            const g = {};
            DATA.tienda.ventas.forEach(v => {
                g[v.fecha] = g[v.fecha] || { fecha: v.fecha, mes: v.fecha.slice(0, 7), concepto: 'Tienda', monto: 0, bruto: 0 };
                g[v.fecha].monto += v.venta - v.costo; g[v.fecha].bruto += v.venta;
            });
            return Object.values(g).map(x => Object.assign(x, { monto: Math.round(x.monto * 100) / 100 }));
        }
        function unirIngresos() { if (DATA.finanzas) DATA.finanzas.ingresos = (DATA.ingresosBase || []).concat(ingresosTienda()); }

        // ---------- Ventas pendientes de enviar (si no hay internet, se guardan en el celular y se reintentan) ----------
        let CARRITO = {}, TIENDA_ENVIANDO = false;
        const pendTienda = () => { try { return JSON.parse(lsGet('tienda_pend') || '[]'); } catch (e) { return []; } };
        const guardarPend = l => lsSet('tienda_pend', l.length ? JSON.stringify(l) : null);
        const pendDe = sku => pendTienda().reduce((t, v) => t + v.items.filter(i => i.sku === sku).reduce((a, i) => a + i.cantidad, 0), 0);
        const stockVisible = p => p.stock - pendDe(p.sku);
        const totalCarrito = () => Object.keys(CARRITO).reduce((t, sku) => t + (producto(sku) ? producto(sku).precio * CARRITO[sku] : 0), 0);
        const piezasCarrito = () => Object.values(CARRITO).reduce((t, n) => t + n, 0);

        function venderTienda(tipo) {
            const items = Object.keys(CARRITO).filter(s => CARRITO[s] > 0).map(sku => ({ sku, cantidad: CARRITO[sku] }));
            if (!items.length) return;
            const total = tipo === 'venta' ? totalCarrito() : 0;
            const l = pendTienda();
            l.push({ uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), tipo, items, total, cuando: new Date().toISOString() });
            guardarPend(l);
            CARRITO = {};
            pintarVender();
            toast(tipo === 'venta' ? `⏳ Guardando venta de ${dinero(total)}…` : '⏳ Guardando consumo…');
            enviarPendientes();
        }

        async function enviarPendientes() {
            if (TIENDA_ENVIANDO) return;
            TIENDA_ENVIANDO = true;
            try {
                while (pendTienda().length) {
                    const v = pendTienda()[0];
                    let d;
                    try {
                        const r = await fetch(URL_SCRIPT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ pin: pin(), accion: 'registrarVenta', uid: v.uid, tipo: v.tipo, items: v.items, cuando: v.cuando }) });
                        d = await r.json();
                    } catch (e) { pintarVender(); return; }          // sin internet: se queda pendiente y se reintenta
                    guardarPend(pendTienda().filter(x => x.uid !== v.uid));
                    if (!d.ok) { alert('❌ No se pudo registrar una venta: ' + d.error); continue; }
                    DATA.tienda = d.tienda; if (RAW) RAW.tienda = d.tienda; unirIngresos();
                    lsSet('fichas_cache', JSON.stringify(DATA));
                    toast(v.tipo === 'venta' ? `✅ Venta registrada · ${dinero(v.total)}` : '✅ Consumo registrado');
                    pintarVender();
                }
            } finally { TIENDA_ENVIANDO = false; }
        }
        window.addEventListener('online', enviarPendientes);
        setInterval(() => { if (pendTienda().length) enviarPendientes(); }, 30000);

        // ---------- VISTA: vender ----------
        function vistaVender() {
            header('🛍️ Tienda', true, DESK ? '' : `${esAdmin() ? `<button class="btn-mini" onclick="ir('#/inventario')">📦 Inventario</button>` : ''}<button class="btn-mini" onclick="cargar()">🔄</button>`);
            if (!tiendaOk()) return main(`<div class="vacio">${DATA.tienda && DATA.tienda.error === 'sin-config'
                ? '⚙️ Falta conectar la hoja de la tiendita.<br>Pon su ID en <b>TIENDA_ID</b> al inicio del Apps Script.'
                : '⚠️ No se pudo leer la hoja de la tiendita.<br>' + esc((DATA.tienda && DATA.tienda.error) || '')}</div>`);
            const ps = DATA.tienda.productos.filter(p => p.activo);
            main(`
                <div id="pendBanner"></div>
                <div class="buscador" style="margin-bottom:12px">
                    <span class="lupa">🔍</span>
                    <input id="buscarProd" type="search" placeholder="Buscar producto…" autocomplete="off" oninput="filtrarProd(this.value)">
                </div>
                <div class="pos-grid">${ps.map(p => `
                    <div class="pos-card" id="pc_${esc(p.sku)}" data-sku="${esc(p.sku)}" data-n="${esc(sinAcentos(p.nombre))}" onclick="sumarProd(this.dataset.sku, 1)">
                        <span class="pos-badge"></span>
                        <button class="pos-menos" onclick="event.stopPropagation(); sumarProd(this.parentNode.dataset.sku, -1)">−</button>
                        <span class="pos-emoji">${esc(p.emoji)}</span>
                        <span class="pos-nom">${esc(p.nombre)}</span>
                        <span class="pos-precio">${dinero(p.precio)}</span>
                        <span class="pos-stock"></span>
                    </div>`).join('')}</div>`);
            footer(`<div class="pos-pie">
                    <div class="pos-total"><span id="posPiezas">0 artículos</span><b id="posTotal">$0</b><button class="pos-vaciar" id="posVaciar" onclick="CARRITO = {}; pintarVender()">Vaciar</button></div>
                    <div class="btns2" style="margin-top:8px">
                        <button class="btn-main btn-verde" id="btnVenta" onclick="venderTienda('venta')">💰 Venta</button>
                        <button class="btn-main btn-gris" id="btnConsumo" style="margin:0" onclick="venderTienda('consumo')">😋 Consumo personal</button>
                    </div></div>`);
            pintarVender();
        }
        function sumarProd(sku, n) {
            CARRITO[sku] = Math.max(0, (CARRITO[sku] || 0) + n);
            if (!CARRITO[sku]) delete CARRITO[sku];
            pintarVender();
        }
        function filtrarProd(q) {
            const t = sinAcentos(q.trim());
            document.querySelectorAll('.pos-card').forEach(c => c.style.display = !t || c.dataset.n.includes(t) ? '' : 'none');
        }
        // Actualiza contadores, existencias y total sin redibujar la pantalla
        function pintarVender() {
            if (!$('posTotal') || !tiendaOk()) return;
            const bajo = DATA.tienda.stockBajo || 5;
            document.querySelectorAll('.pos-card').forEach(c => {
                const p = producto(c.dataset.sku); if (!p) return;
                const n = CARRITO[p.sku] || 0, st = stockVisible(p);
                c.classList.toggle('sel', n > 0);
                c.querySelector('.pos-badge').textContent = n || '';
                const el = c.querySelector('.pos-stock');
                el.textContent = st <= 0 ? 'Agotado' : `Quedan ${st}`;
                el.className = 'pos-stock ' + (st <= 0 ? 'rojo' : st <= bajo ? 'naranja' : '');
            });
            const n = piezasCarrito();
            $('posPiezas').textContent = `${n} artículo${n === 1 ? '' : 's'}`;
            $('posTotal').textContent = dinero(totalCarrito());
            $('posVaciar').style.visibility = n ? 'visible' : 'hidden';
            $('btnVenta').disabled = $('btnConsumo').disabled = !n;
            $('btnVenta').textContent = n ? `💰 Venta · ${dinero(totalCarrito())}` : '💰 Venta';
            const pend = pendTienda();
            const b = $('pendBanner');
            if (b) b.innerHTML = pend.length ? `<div class="aviso" style="margin:0 0 12px">⏳ ${pend.length} venta${pend.length === 1 ? '' : 's'} por enviar${TIENDA_ENVIANDO ? '…' : ' (sin conexión)'} · <span class="link-pin" onclick="enviarPendientes()">Reintentar</span></div>` : '';
        }

        // ---------- VISTA: tienda / inventario (administrador, computadora) ----------
        let TIE_MES = '', TIE_INACT = false, TIE_COMPRAS = [], TIE_RANGO = 1;
        function vistaTienda() {
            if (!esAdmin() || !DESK) return vistaVender();
            if (!TIE_MES) TIE_MES = hoy().slice(0, 7);
            if (tiendaOk()) lleno();
            header('🛍️ Tienda', false, tiendaOk() ? `<button class="btn-mini" onclick="formCompra()">📦 Registrar compra</button><button class="btn-mini" onclick="formProducto()">➕ Producto</button><button class="btn-mini btn-cola" onclick="ir('#/vender')">🛒 Vender</button>` : '');
            if (!tiendaOk()) return vistaVender();
            const ym = TIE_MES, bajo = DATA.tienda.stockBajo || 5, n = TIE_RANGO;
            // Periodo: el mes elegido o los últimos 3, 6 o 12 meses hasta ese mes
            const MS = Array.from({ length: n }, (_, i) => mesMas(ym, i - n + 1));
            const periodo = n === 1 ? (fMes(ym) || nombreMes(ym)) : `${MES_CORTO[Number(MS[0].slice(5)) - 1]} ${MS[0].slice(2, 4)} – ${MES_CORTO[Number(ym.slice(5)) - 1]} ${ym.slice(2, 4)}`;
            const vm = (DATA.tienda.ventas || []).filter(v => MS.includes(v.fecha.slice(0, 7)));
            const ventas = vm.filter(v => !v.consumo), cons = vm.filter(v => v.consumo);
            const suma = (l, k) => l.reduce((t, v) => t + v[k], 0);
            const bruto = suma(ventas, 'venta'), ganancia = suma(vm, 'venta') - suma(vm, 'costo');
            const vendidos = sku => ventas.filter(v => v.sku === sku).reduce((t, v) => t + v.piezas, 0);
            const ps = DATA.tienda.productos.slice().sort((a, b) => (b.activo - a.activo) || vendidos(b.sku) - vendidos(a.sku));
            const activos = ps.filter(p => p.activo), inact = ps.filter(p => !p.activo);
            const surtir = activos.filter(p => stockVisible(p) <= bajo).sort((a, b) => stockVisible(a) - stockVisible(b));
            // Top productos del mes por piezas vendidas
            const top = ps.map(p => ({ p, n: vendidos(p.sku), g: ventas.filter(v => v.sku === p.sku).reduce((t, v) => t + v.venta - v.costo, 0) }))

                return `<span class="estado-chip" style="${estiloEst(s2 <= 0 ? 'vencido' : s2 <= bajo ? 'pronto' : 'ok')}">${s2 <= 0 ? (s2 < 0 ? `${s2} (revisar)` : 'Agotado') : s2}</span>`; };
